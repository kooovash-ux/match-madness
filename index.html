<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Match Madness</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg0:#0a0e1a; --bg1:#12081f;
    --cyan:#00e5ff; --cyan2:#3ec9ff;
    --pink:#ff2d78; --pink2:#ff4fd8;
    --purple:#a855f7;
    --ink:#eaf2ff; --ink-dim:#8c96b8;
    --danger:#ff3b5c;
    --ease-out:cubic-bezier(.16,.84,.44,1);
    --spring:cubic-bezier(.34,1.56,.64,1);
  }
  * { box-sizing: border-box; }
  html,body{ overflow-x:hidden; }
  body {
    margin: 0;
    font-family: "Rajdhani", -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    color: var(--ink);
    min-height: 100vh;
    background:
      radial-gradient(120% 80% at 15% -10%, rgba(0,229,255,.14), transparent 55%),
      radial-gradient(120% 80% at 90% 5%, rgba(255,45,120,.14), transparent 55%),
      radial-gradient(140% 100% at 50% 120%, rgba(168,85,247,.16), transparent 60%),
      linear-gradient(160deg, var(--bg0) 0%, var(--bg1) 100%);
    background-attachment: fixed;
    -webkit-tap-highlight-color: transparent;
  }
  /* soft edge vignette + faint noise glow */
  body::before{
    content:""; position:fixed; inset:0; pointer-events:none; z-index:0;
    background:
      radial-gradient(130% 120% at 50% 50%, transparent 58%, rgba(0,0,0,.55) 100%);
    mix-blend-mode:multiply;
  }
  .app {
    position:relative; z-index:1;
    max-width: 480px;
    margin: 0 auto;
    padding: 16px;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  .topbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
    animation: fadeSlide .22s var(--ease-out) both;
  }
  .timer {
    font-family:"Orbitron", monospace;
    font-size: 30px;
    font-weight: 800;
    letter-spacing: 1px;
    color: var(--cyan);
    text-shadow: 0 0 8px rgba(0,229,255,.65), 0 0 22px rgba(0,229,255,.35);
    transition: color .18s var(--ease-out), text-shadow .18s var(--ease-out);
  }
  .timer.low {
    color: var(--danger);
    text-shadow: 0 0 10px rgba(255,59,92,.8), 0 0 26px rgba(255,59,92,.45);
    animation: timerPulse .9s ease-in-out infinite;
  }
  .score {
    font-family:"Orbitron", monospace;
    font-size: 19px;
    font-weight: 700;
    color: var(--ink);
    text-shadow: 0 0 8px rgba(168,85,247,.4);
  }
  .round-label {
    text-align: center;
    font-size: 13px;
    font-weight: 700;
    color: var(--ink-dim);
    text-transform: uppercase;
    letter-spacing: 2px;
    margin-bottom: 12px;
    animation: fadeSlide .24s var(--ease-out) both;
  }

  .board {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    flex: 1;
  }
  .col { display: flex; flex-direction: column; gap: 10px; }

  .card {
    position:relative;
    border: 1.5px solid transparent;
    border-radius: 14px;
    padding: 16px 10px;
    font-family:"Rajdhani", sans-serif;
    font-size: 17px;
    font-weight: 600;
    letter-spacing: .3px;
    cursor: pointer;
    color: #fff;
    text-align: center;
    user-select: none;
    min-height: 56px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(18,24,40,.55);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    transition: transform .16s var(--spring), opacity .2s var(--ease-out),
                box-shadow .16s var(--ease-out), border-color .16s var(--ease-out),
                background .2s var(--ease-out);
    animation: cardIn .19s var(--ease-out) both;
  }
  .card.en {
    border-color: rgba(0,229,255,.55);
    box-shadow: 0 0 0 1px rgba(0,229,255,.15) inset,
                0 0 14px rgba(0,229,255,.28), 0 6px 18px rgba(0,0,0,.35);
  }
  .card.ru {
    border-color: rgba(255,45,120,.55);
    box-shadow: 0 0 0 1px rgba(255,45,120,.15) inset,
                0 0 14px rgba(255,45,120,.28), 0 6px 18px rgba(0,0,0,.35);
  }
  .card:active { transform: scale(.97); }
  .card.selected.en {
    border-color: var(--cyan);
    box-shadow: 0 0 0 2px rgba(0,229,255,.5) inset,
                0 0 22px rgba(0,229,255,.6), 0 0 40px rgba(0,229,255,.35);
    background: rgba(0,229,255,.10);
  }
  .card.selected.ru {
    border-color: var(--pink);
    box-shadow: 0 0 0 2px rgba(255,45,120,.5) inset,
                0 0 22px rgba(255,45,120,.6), 0 0 40px rgba(255,45,120,.35);
    background: rgba(255,45,120,.10);
  }
  .card.correct {
    animation: correctFlash .35s var(--ease-out) both;
  }
  .card.wrong {
    animation: wrongShake .35s cubic-bezier(.36,.07,.19,.97) both;
  }
  .card.gone { opacity: 0; pointer-events: none; transform: scale(.8); }
  .card.matched {
    background: rgba(255,255,255,.03) !important;
    color: var(--ink-dim);
    border-color: rgba(140,150,184,.18);
    cursor: default;
    box-shadow: none;
    opacity: .45;
    transform: none;
    animation: none;
  }
  .card.empty { visibility: hidden; pointer-events: none; box-shadow: none; }

  /* stagger entrance across both columns */
  .col .card:nth-child(1){ animation-delay:.02s; }
  .col .card:nth-child(2){ animation-delay:.06s; }
  .col .card:nth-child(3){ animation-delay:.10s; }
  .col .card:nth-child(4){ animation-delay:.14s; }
  .col .card:nth-child(5){ animation-delay:.18s; }
  .col .card:nth-child(6){ animation-delay:.22s; }

  @keyframes cardIn {
    0%   { opacity:0; transform: scale(.9) translateY(8px); }
    100% { opacity:1; transform: scale(1) translateY(0); }
  }
  @keyframes correctFlash {
    0%   { transform: scale(1); }
    35%  { transform: scale(1.08);
           box-shadow: 0 0 0 2px rgba(62,255,180,.7) inset,
                       0 0 30px rgba(62,255,180,.85), 0 0 60px rgba(0,229,255,.5);
           border-color:#3effb4; background: rgba(62,255,180,.16); }
    100% { transform: scale(1); opacity:.55;
           box-shadow: 0 0 14px rgba(62,255,180,.2); }
  }
  @keyframes wrongShake {
    0%,100% { transform: translateX(0); }
    15% { transform: translateX(-7px); border-color:var(--danger);
          box-shadow:0 0 22px rgba(255,59,92,.75); background:rgba(255,59,92,.14); }
    35% { transform: translateX(6px); box-shadow:0 0 26px rgba(255,59,92,.85); }
    55% { transform: translateX(-4px); }
    75% { transform: translateX(3px); border-color:var(--danger);
          box-shadow:0 0 20px rgba(255,59,92,.6); }
  }
  @keyframes timerPulse {
    0%,100% { transform: scale(1); }
    50%     { transform: scale(1.06); }
  }
  @keyframes fadeSlide {
    0%   { opacity:0; transform: translateY(14px); }
    100% { opacity:1; transform: translateY(0); }
  }
  @keyframes screenIn {
    0%   { opacity:0; transform: translateY(16px); }
    100% { opacity:1; transform: translateY(0); }
  }
  @keyframes btnBreathe {
    0%,100% { box-shadow: 0 0 0 1.5px rgba(255,255,255,.12) inset,
                          0 0 18px rgba(255,45,120,.4), 0 0 32px rgba(0,229,255,.25); }
    50%     { box-shadow: 0 0 0 1.5px rgba(255,255,255,.2) inset,
                          0 0 30px rgba(255,45,120,.7), 0 0 55px rgba(0,229,255,.5); }
  }

  .screen {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    gap: 16px;
    padding: 24px 8px;
    animation: screenIn .26s var(--ease-out) both;
  }
  .screen h1 {
    font-family:"Orbitron", sans-serif;
    font-size: 30px; margin: 0; font-weight:900; letter-spacing:1px;
    color: #fff;
    text-shadow: 0 0 12px rgba(255,45,120,.6), 0 0 28px rgba(0,229,255,.4);
  }
  .screen h2 {
    font-family:"Orbitron", sans-serif;
    font-size: 22px; margin: 0; font-weight:700; color: #fff;
    text-shadow: 0 0 10px rgba(0,229,255,.5);
  }
  .screen p { margin: 0; color: var(--ink-dim); font-size: 15px; line-height:1.45; max-width:340px; }
  .big-score {
    font-family:"Orbitron", monospace;
    font-size: 54px; font-weight: 900; color: var(--cyan);
    text-shadow: 0 0 16px rgba(0,229,255,.7), 0 0 40px rgba(0,229,255,.4);
  }

  .btn {
    position:relative;
    color: #fff;
    border: 1.5px solid rgba(255,255,255,.35);
    border-radius: 14px;
    padding: 15px 32px;
    font-family:"Rajdhani", sans-serif;
    font-size: 17px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1px;
    cursor: pointer;
    width: 100%;
    max-width: 280px;
    background: linear-gradient(100deg, var(--pink) 0%, var(--purple) 52%, var(--cyan) 100%);
    box-shadow: 0 0 18px rgba(255,45,120,.4), 0 0 30px rgba(0,229,255,.25),
                0 6px 20px rgba(0,0,0,.4);
    transition: transform .14s var(--spring), box-shadow .18s var(--ease-out), filter .18s var(--ease-out);
  }
  .btn:hover { filter: brightness(1.08);
    box-shadow: 0 0 28px rgba(255,45,120,.65), 0 0 48px rgba(0,229,255,.45), 0 6px 22px rgba(0,0,0,.4); }
  .btn:active { transform: scale(.97); }
  #startBtn { animation: btnBreathe 2s ease-in-out infinite; }
  #startBtn:hover { animation: none; }
  .btn.secondary {
    background: rgba(18,24,40,.5);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    color: var(--ink);
    border: 1.5px solid rgba(140,150,184,.35);
    box-shadow: 0 4px 16px rgba(0,0,0,.35);
  }
  .btn.secondary:hover { border-color: var(--cyan2);
    box-shadow: 0 0 18px rgba(0,229,255,.35), 0 4px 16px rgba(0,0,0,.35); filter:none; }
  .btn.small { padding: 10px 20px; font-size: 13px; text-transform:none; letter-spacing:.5px; }

  .reject-list {
    width: 100%;
    max-height: 260px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin: 8px 0;
  }
  .reject-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: rgba(255,255,255,.04);
    border:1px solid rgba(140,150,184,.16);
    border-radius: 12px;
    padding: 10px 14px;
    font-size: 15px;
    color: var(--ink);
  }
  .reject-item span { text-align: left; }
  .reject-item button {
    background: none;
    border: 1.5px solid rgba(140,150,184,.4);
    border-radius: 9px;
    padding: 5px 12px;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    color: var(--ink-dim);
    transition: all .15s var(--ease-out);
  }
  .reject-item button.marked {
    background: rgba(255,59,92,.16);
    border-color: var(--danger);
    color: #fff;
    box-shadow: 0 0 14px rgba(255,59,92,.4);
  }

  .settings-panel { width: 100%; text-align: left; }
  .settings-panel h3 { font-size: 15px; margin: 14px 0 6px; color: var(--ink); font-weight:700; }
  .settings-panel .row { display: flex; gap: 8px; margin-bottom: 8px; }
  .settings-panel input, .settings-panel textarea {
    flex: 1;
    border: 1.5px solid rgba(140,150,184,.3);
    border-radius: 11px;
    padding: 11px 13px;
    font-size: 14px;
    font-family: inherit;
    background: rgba(10,14,26,.6);
    color: var(--ink);
    transition: border-color .15s var(--ease-out), box-shadow .15s var(--ease-out);
  }
  .settings-panel input::placeholder, .settings-panel textarea::placeholder { color: rgba(140,150,184,.6); }
  .settings-panel input:focus, .settings-panel textarea:focus {
    outline:none; border-color: var(--cyan2);
    box-shadow: 0 0 14px rgba(0,229,255,.3);
  }
  .settings-panel textarea { width: 100%; min-height: 80px; resize: vertical; }
  .word-list { max-height: 150px; overflow-y: auto; margin-bottom: 8px; }
  .word-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 7px 0;
    border-bottom: 1px solid rgba(140,150,184,.12);
    font-size: 13px;
    color: var(--ink);
  }
  .word-row button {
    background: none;
    border: none;
    color: var(--danger);
    font-weight: 700;
    cursor: pointer;
    font-size: 13px;
  }
  .tabs { display: flex; gap: 6px; margin-bottom: 10px; }
  .tabs button {
    flex: 1;
    padding: 9px;
    border: 1.5px solid rgba(140,150,184,.3);
    background: rgba(18,24,40,.5);
    border-radius: 11px;
    font-family:"Rajdhani", sans-serif;
    font-weight: 700;
    font-size: 12px;
    cursor: pointer;
    color: var(--ink-dim);
    transition: all .16s var(--ease-out);
  }
  .tabs button.active {
    border-color: var(--cyan);
    color: #fff;
    background: rgba(0,229,255,.12);
    box-shadow: 0 0 16px rgba(0,229,255,.35), 0 0 0 1px rgba(0,229,255,.2) inset;
  }
  .stat-line { font-size: 13px; color: var(--ink-dim); margin-bottom: 6px; }

  .source-picker { display:flex; flex-wrap:wrap; gap:8px; justify-content:center; max-width:320px; width:100%; }
  .src-chip {
    border: 1.5px solid rgba(140,150,184,.3);
    background: rgba(18,24,40,.5);
    border-radius: 999px;
    padding: 8px 14px;
    font-family:"Rajdhani", sans-serif;
    font-weight: 700;
    font-size: 13px;
    cursor: pointer;
    color: var(--ink-dim);
    transition: all .16s var(--ease-out);
    display:flex; align-items:center; gap:6px;
  }
  .src-chip .src-count { font-size:11px; opacity:.75; }
  .src-chip.active {
    border-color: var(--pink2);
    color: #fff;
    background: linear-gradient(100deg, rgba(255,45,120,.22), rgba(0,229,255,.16));
    box-shadow: 0 0 14px rgba(255,45,120,.35), 0 0 0 1px rgba(255,45,120,.2) inset;
  }
  .src-chip:active { transform: scale(.95); }

  .record-card {
    width: 100%;
    max-width: 280px;
    background:
      linear-gradient(135deg, rgba(255,45,120,.12), rgba(0,229,255,.10));
    border: 1.5px solid rgba(255,79,216,.5);
    border-radius: 16px;
    padding: 14px 16px;
    margin-bottom: 4px;
    text-align: center;
    box-shadow: 0 0 20px rgba(255,45,120,.22), inset 0 0 20px rgba(0,229,255,.06);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
  }
  .record-card .stars {
    font-size: 22px;
    color: #FFC800;
    letter-spacing: 4px;
    line-height: 1;
    margin-bottom: 4px;
    text-shadow: 0 0 10px rgba(255,200,0,.6);
  }
  .record-card .record-main {
    font-family:"Orbitron", sans-serif;
    font-size: 24px;
    font-weight: 800;
    color: #fff;
    text-shadow: 0 0 12px rgba(0,229,255,.4);
  }
  .record-card .record-sub {
    font-size: 13px;
    color: var(--ink-dim);
    margin-top: 3px;
  }
  .record-card.empty {
    background: rgba(255,255,255,.03);
    border: 1.5px dashed rgba(140,150,184,.3);
    box-shadow:none;
  }
  .record-card.empty .record-main { color: var(--ink-dim); font-size: 15px; font-weight: 700; text-shadow:none; font-family:"Rajdhani",sans-serif; }
  .hidden { display: none !important; }

  /* neon scrollbars */
  .reject-list::-webkit-scrollbar, .word-list::-webkit-scrollbar { width:6px; }
  .reject-list::-webkit-scrollbar-thumb, .word-list::-webkit-scrollbar-thumb {
    background: rgba(0,229,255,.35); border-radius: 3px;
  }
</style>
</head>

  // ---------- Source selection (multi-select: any combo of a1/a2/b1/b2/custom) ----------
  var LS_SOURCES = "mm_selected_sources";
  function loadSelectedSources() {
    try {
      var raw = JSON.parse(localStorage.getItem(LS_SOURCES) || "null");
      if (Array.isArray(raw) && raw.length) return raw;
    } catch (e) {}
    return ["a1"]; // sensible default for a fresh install
  }
  function saveSelectedSources(list) {
    localStorage.setItem(LS_SOURCES, JSON.stringify(list));
  }
  function toggleSource(key) {
    var list = loadSelectedSources();
    var idx = list.indexOf(key);
    if (idx >= 0) {
      if (list.length === 1) return; // keep at least one source selected
      list.splice(idx, 1);
    } else {
      list.push(key);
    }
    saveSelectedSources(list);
  }

  function getActiveWordPool() {
    var rejected = loadRejected();
    var rejectedKeys = {};
    rejected.forEach(function (w) { rejectedKeys[w.en.toLowerCase()] = true; });

    var selected = loadSelectedSources();
    var all = [];
    selected.forEach(function (key) {
      if (key === "custom") all = all.concat(loadCustomWords());
      else if (LEVEL_WORDS[key]) all = all.concat(LEVEL_WORDS[key]);
    });

    return all.filter(function (w) { return !rejectedKeys[w.en.toLowerCase()]; });
  }

  function shuffle(arr) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
    }
    return a;
  }

    var html = "";

      '<div class="screen">' +
        '<h1>Match Madness</h1>' +
        '<p>Собери пары слов на скорость. Правильный ответ - время и очки. Ошибка - минус время.</p>' +
        recordHtml +
        '<p style="margin-top:4px;">Выбери одну или несколько баз слов:</p>' +
        sourcePickerHtml +
        '<div class="stat-line" id="poolCountLine">Слов в игре: ' + pool.length + '</div>' +
        '<button class="btn" id="startBtn">Начать</button>' +
        '<button class="btn secondary" id="settingsBtn">Настройки слов</button>' +
      '</div>';

    Array.prototype.forEach.call(document.querySelectorAll(".src-chip"), function (btn) {
      btn.onclick = function () {
        toggleSource(btn.getAttribute("data-src"));
        render();
      };
    });

    document.getElementById("startBtn").onclick = startGame;
    document.getElementById("settingsBtn").onclick = function () {
      state.screen = "settings";
      render();
    };
  }

  function startGame() {
    var pool = getActiveWordPool();
    if (pool.length < CYCLE_SIZE) {
      alert("Нужно минимум " + CYCLE_SIZE + " слов в базе, чтобы начать игру. Сейчас: " + pool.length);
      return;
    }
    state.poolQueue = shuffle(pool);
    state.idCounter = 0;
    state.timeLeft = START_TIME;
    state.score = 0;
    state.matchedCount = 0;
    state.usedWords = [];
    state.selectedLeft = null;
    state.selectedRight = null;
    state.busy = false;
    state.screen = "playing";

    startCycle();
    render();
    startTimer();
  }

  // ---------- PLAYING ----------
  function nextWordsFromPool(count) {
    var activePool = getActiveWordPool();
    var words = [];
    for (var i = 0; i < count; i++) {
      if (state.poolQueue.length === 0) {
        state.poolQueue = shuffle(activePool);
      }
      words.push(state.poolQueue.shift());
    }
    return words;
  }

  function startCycle() {
    var words = nextWordsFromPool(CYCLE_SIZE);
    words.forEach(function (w) {
      var already = state.usedWords.some(function (u) { return u.en === w.en; });
      if (!already) state.usedWords.push(w);
    });
    state.board = words.map(function (w) {
      return { id: state.idCounter++, en: w.en, ru: w.ru, matched: false };
    });
    state.rightOrder = shuffle(state.board.map(function (c) { return c.id; }));
    state.selectedLeft = null;
    state.selectedRight = null;
    state.busy = false;
  }

  function startTimer() {
    if (state.timerHandle) clearInterval(state.timerHandle);
    state.timerHandle = setInterval(function () {
      state.timeLeft -= 1;
      updateTimerDisplay();
      if (state.timeLeft <= 0) {
        clearInterval(state.timerHandle);
        state.timeLeft = 0;
        timeUp();
      }
    }, 1000);
  }

  function stopTimer() {
    if (state.timerHandle) {
      clearInterval(state.timerHandle);
      state.timerHandle = null;
    }
  }

  function updateTimerDisplay() {
    var el = document.getElementById("timerDisplay");
    if (!el) return;
    var m = Math.floor(state.timeLeft / 60);
    var s = state.timeLeft % 60;
    el.textContent = (m < 10 ? "0" : "") + m + ":" + (s < 10 ? "0" : "") + s;
    el.classList.toggle("low", state.timeLeft <= 10);
  }

  function timeUp() {
    state.gameOverReason = "time";
    endGame();
  }

  function renderPlaying() {
    var byId = {};
    state.board.forEach(function (c) { byId[c.id] = c; });
    var rightItems = state.rightOrder.map(function (id) { return byId[id]; });

    var leftHtml = state.board.map(function (c) {
      return '<button class="card en' + (c.matched ? ' matched' : '') + '" data-side="left" data-id="' + c.id + '"' + (c.matched ? ' disabled' : '') + '>' + escapeHtml(c.en) + '</button>';
    }).join("");
    var rightHtml = rightItems.map(function (c) {
      return '<button class="card ru' + (c.matched ? ' matched' : '') + '" data-side="right" data-id="' + c.id + '"' + (c.matched ? ' disabled' : '') + '>' + escapeHtml(c.ru) + '</button>';
    }).join("");

    app.innerHTML =
      '<div class="topbar">' +
        '<div class="timer" id="timerDisplay"></div>' +
        '<div class="score" id="scoreDisplay">' + state.score + ' очк.</div>' +
      '</div>' +
      '<div class="round-label">Смэтчено: ' + state.matchedCount + '</div>' +
      '<div class="board">' +
        '<div class="col" id="colLeft">' + leftHtml + '</div>' +
        '<div class="col" id="colRight">' + rightHtml + '</div>' +
      '</div>';

    updateTimerDisplay();

    Array.prototype.forEach.call(document.querySelectorAll(".card"), function (btn) {
      btn.onclick = onCardClick;
    });
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function onCardClick(e) {
    var btn = e.currentTarget;
    var side = btn.getAttribute("data-side");
    var id = parseInt(btn.getAttribute("data-id"), 10);

    if (state.busy) return;
    if (btn.classList.contains("matched")) return;

    Array.prototype.forEach.call(document.querySelectorAll(".card[data-side='" + side + "']"), function (b) {
      b.classList.remove("selected");
    });
    btn.classList.add("selected");

    if (side === "left") state.selectedLeft = id;
    else state.selectedRight = id;

    if (state.selectedLeft !== null && state.selectedRight !== null) {
      checkMatch();
    }
  }

  function checkMatch() {
    state.busy = true;
    var leftId = state.selectedLeft;
    var rightId = state.selectedRight;
    var leftBtn = document.querySelector(".card[data-side='left'][data-id='" + leftId + "']");
    var rightBtn = document.querySelector(".card[data-side='right'][data-id='" + rightId + "']");

    var isMatch = leftId === rightId;

    if (isMatch) {
      state.score += SCORE_CORRECT;
      state.matchedCount += 1;
      state.timeLeft += TIME_BONUS;
      leftBtn.classList.add("correct");
      rightBtn.classList.add("correct");
      updateTimerDisplay();
      updateScoreDisplay();
      setTimeout(function () {
        var item = state.board.filter(function (c) { return c.id === leftId; })[0];
        if (item) item.matched = true;
        leftBtn.classList.remove("correct", "selected");
        rightBtn.classList.remove("correct", "selected");
        leftBtn.classList.add("matched");
        rightBtn.classList.add("matched");
        leftBtn.disabled = true;
        rightBtn.disabled = true;
        state.selectedLeft = null;
        state.selectedRight = null;
        state.busy = false;

        var allMatched = state.board.every(function (c) { return c.matched; });
        if (allMatched) {
          setTimeout(function () {
            startCycle();
            render();
          }, 400);
        }
      }, 350);
    } else {
      state.score = Math.max(0, state.score - SCORE_WRONG);
      state.timeLeft = Math.max(0, state.timeLeft - TIME_PENALTY);
      leftBtn.classList.add("wrong");
      rightBtn.classList.add("wrong");
      updateTimerDisplay();
      updateScoreDisplay();
      if (state.timeLeft <= 0) {
        setTimeout(function () {
          stopTimer();
          timeUp();
        }, 350);
        return;
      }
      setTimeout(function () {
        leftBtn.classList.remove("selected", "wrong");
        rightBtn.classList.remove("selected", "wrong");
        state.selectedLeft = null;
        state.selectedRight = null;
        state.busy = false;
      }, 350);
    }
  }

  function updateScoreDisplay() {
    var el = document.getElementById("scoreDisplay");
    if (el) el.textContent = state.score + " очк.";
  }

  function endGame() {
    stopTimer();
    state.screen = "gameOver";

    var record = loadRecord();
    state.isNewRecord = !record || state.matchedCount > record.matched;
    if (state.isNewRecord) {
      saveRecord({ matched: state.matchedCount, score: state.score, date: formatDateTime(new Date()) });
    }

    render();
  }

  function renderGameOver() {
    var reason = state.gameOverReason === "time" ? "Время вышло!" : "Игра завершена!";
    var usedWords = state.usedWords;
    var rejectedNow = {};

    var listHtml = usedWords.map(function (w, i) {
      return '<div class="reject-item">' +
        '<span>' + escapeHtml(w.en) + ' - ' + escapeHtml(w.ru) + '</span>' +
        '<button data-idx="' + i + '">Убрать</button>' +
        '</div>';
    }).join("");

    app.innerHTML =
      '<div class="screen">' +
        '<h1>' + reason + '</h1>' +
        '<div class="stars" style="font-size:28px;">' + starsHtml(starsFor(state.matchedCount)) + '</div>' +
        '<div class="big-score">' + state.score + '</div>' +
        '<p>итоговый счёт - замэчено ' + pluralWords(state.matchedCount) + '</p>' +
        (state.isNewRecord ? '<p style="color:#58CC02;font-weight:800;">Новый рекорд!</p>' : '') +
        (usedWords.length ? (
          '<p style="margin-top:8px;">Отметь слова, которые не зашли - они больше не будут появляться:</p>' +
          '<div class="reject-list">' + listHtml + '</div>'
        ) : '') +
        '<button class="btn" id="playAgainBtn">Играть снова</button>' +
        '<button class="btn secondary" id="homeBtn">На главную</button>' +
      '</div>';

    Array.prototype.forEach.call(document.querySelectorAll(".reject-item button"), function (btn) {
      btn.onclick = function () {
        var idx = parseInt(btn.getAttribute("data-idx"), 10);
        var w = usedWords[idx];
        var key = w.en.toLowerCase();
        if (rejectedNow[key]) {
          delete rejectedNow[key];
          btn.classList.remove("marked");
          btn.textContent = "Убрать";
        } else {
          rejectedNow[key] = w;
          btn.classList.add("marked");
          btn.textContent = "Убрано";
        }
      };
    });

    document.getElementById("playAgainBtn").onclick = function () {
      commitRejected(rejectedNow);
      startGame();
    };
    document.getElementById("homeBtn").onclick = function () {
      commitRejected(rejectedNow);
      state.screen = "home";
      render();
    };
  }

  function commitRejected(rejectedNow) {
    var keys = Object.keys(rejectedNow);
    if (keys.length === 0) return;
    var existing = loadRejected();
    var existingKeys = {};
    existing.forEach(function (w) { existingKeys[w.en.toLowerCase()] = true; });
    keys.forEach(function (k) {
      if (!existingKeys[k]) {
        existing.push(rejectedNow[k]);
        existingKeys[k] = true;
      }
    });
    saveRejected(existing);
  }

  // ---------- SETTINGS ----------
  function renderSettings() {
    var tab = state.settingsTab;
    var custom = loadCustomWords();
    var rejected = loadRejected();

    var body = "";
    if (tab === "add") {
      body =
        '<div class="row">' +
          '<input type="text" id="enInput" placeholder="Слово на английском">' +
          '<input type="text" id="ruInput" placeholder="Перевод на русском">' +
        '</div>' +
        '<button class="btn small" id="addWordBtn" style="width:auto;">Добавить</button>' +
        '<h3>Твои слова (' + custom.length + ')</h3>' +
        '<div class="word-list">' +
          custom.map(function (w, i) {
            return '<div class="word-row"><span>' + escapeHtml(w.en) + ' - ' + escapeHtml(w.ru) + '</span><button data-idx="' + i + '">Удалить</button></div>';
          }).join("") +
        '</div>';
    } else if (tab === "bulk") {
      body =
        '<p style="font-size:13px;color:#777;">По одной паре на строку, формат: слово - перевод</p>' +
        '<textarea id="bulkInput" placeholder="dog - собака\ncat - кошка"></textarea>' +
        '<button class="btn small" id="bulkAddBtn" style="width:auto;margin-top:8px;">Импортировать</button>';
    } else if (tab === "rejected") {
      body =
        '<h3>Убранные слова (' + rejected.length + ')</h3>' +
        '<p style="font-size:13px;color:#777;">Эти слова не появляются в игре. Верни, если передумал.</p>' +
        '<div class="word-list">' +
          rejected.map(function (w, i) {
            return '<div class="word-row"><span>' + escapeHtml(w.en) + ' - ' + escapeHtml(w.ru) + '</span><button data-idx="' + i + '">Вернуть</button></div>';
          }).join("") +
        '</div>';
    }

    var pool = getActiveWordPool();

    app.innerHTML =
      '<div class="screen" style="justify-content:flex-start;">' +
        '<h2>Настройки слов</h2>' +
        '<div class="stat-line">Активно слов в игре: ' + pool.length + ' (Начинающий: ' + A1_WORDS.length + ', Элементарный: ' + A2_WORDS.length + ', Средний: ' + B1_WORDS.length + ', Выше среднего: ' + B2_WORDS.length + ', Продвинутый: ' + C1_WORDS.length + ', свои: ' + custom.length + ', убрано: ' + rejected.length + ')</div>' +
        '<div class="tabs">' +
          '<button data-tab="add" class="' + (tab === "add" ? "active" : "") + '">Добавить</button>' +
          '<button data-tab="bulk" class="' + (tab === "bulk" ? "active" : "") + '">Массово</button>' +
          '<button data-tab="rejected" class="' + (tab === "rejected" ? "active" : "") + '">Убранные</button>' +
        '</div>' +
        '<div class="settings-panel">' + body + '</div>' +
        '<button class="btn secondary" id="backBtn">Назад</button>' +
      '</div>';

    Array.prototype.forEach.call(document.querySelectorAll(".tabs button"), function (btn) {
      btn.onclick = function () {
        state.settingsTab = btn.getAttribute("data-tab");
        render();
      };
    });

    document.getElementById("backBtn").onclick = function () {
      state.screen = "home";
      render();
    };

    if (tab === "add") {
      document.getElementById("addWordBtn").onclick = function () {
        var en = document.getElementById("enInput").value.trim();
        var ru = document.getElementById("ruInput").value.trim();
        if (!en || !ru) return;
        var list = loadCustomWords();
        list.push({ en: en, ru: ru });
        saveCustomWords(list);
        render();
      };
      Array.prototype.forEach.call(document.querySelectorAll("#app .word-list button"), function (btn) {
        btn.onclick = function () {
          var idx = parseInt(btn.getAttribute("data-idx"), 10);
          var list = loadCustomWords();
          list.splice(idx, 1);
          saveCustomWords(list);
          render();
        };
      });
    } else if (tab === "bulk") {
      document.getElementById("bulkAddBtn").onclick = function () {
        var text = document.getElementById("bulkInput").value;
        var lines = text.split("\n");
        var list = loadCustomWords();
        var added = 0;
        lines.forEach(function (line) {
          line = line.trim();
          if (!line) return;
          var parts = line.split(/\s+-\s+/);
          if (parts.length !== 2) {
            parts = line.split("-");
          }
          if (parts.length === 2) {
            var en = parts[0].trim();
            var ru = parts[1].trim();
            if (en && ru) {
              list.push({ en: en, ru: ru });
              added++;
            }
          }
        });
        saveCustomWords(list);
        render();
      };
    } else if (tab === "rejected") {
      Array.prototype.forEach.call(document.querySelectorAll("#app .word-list button"), function (btn) {
        btn.onclick = function () {
          var idx = parseInt(btn.getAttribute("data-idx"), 10);
          var list = loadRejected();
          list.splice(idx, 1);
          saveRejected(list);
          render();
        };
      });
    }
  }

  render();
})();
</script>
</body>
</html>
