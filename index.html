<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Match Madness</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg0:#0a0e1a; --bg1:#12081f;
    --cyan:#00e5ff; --cyan2:#3ec9ff;
    --pink:#ff2d78; --pink2:#ff4fd8;
    --purple:#a855f7;
    --ink:#eaf2ff; --ink-dim:#8c96b8;
    --danger:#ff3b5c;
    --ease-out:cubic-bezier(.16,.84,.44,1);
    --spring:cubic-bezier(.34,1.56,.64,1);
  }
  * { box-sizing: border-box; }
  html,body{ overflow-x:hidden; }
  body {
    margin: 0;
    font-family: "Rajdhani", -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    color: var(--ink);
    min-height: 100vh;
    background:
      radial-gradient(120% 80% at 15% -10%, rgba(0,229,255,.14), transparent 55%),
      radial-gradient(120% 80% at 90% 5%, rgba(255,45,120,.14), transparent 55%),
      radial-gradient(140% 100% at 50% 120%, rgba(168,85,247,.16), transparent 60%),
      linear-gradient(160deg, var(--bg0) 0%, var(--bg1) 100%);
    background-attachment: fixed;
    -webkit-tap-highlight-color: transparent;
  }
  /* soft edge vignette + faint noise glow */
  body::before{
    content:""; position:fixed; inset:0; pointer-events:none; z-index:0;
    background:
      radial-gradient(130% 120% at 50% 50%, transparent 58%, rgba(0,0,0,.55) 100%);
    mix-blend-mode:multiply;
  }
  .app {
    position:relative; z-index:1;
    max-width: 480px;
    margin: 0 auto;
    padding: 16px;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  .topbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
    animation: fadeSlide .22s var(--ease-out) both;
  }
  .timer {
    font-family:"Orbitron", monospace;
    font-size: 30px;
    font-weight: 800;
    letter-spacing: 1px;
    color: var(--cyan);
    text-shadow: 0 0 8px rgba(0,229,255,.65), 0 0 22px rgba(0,229,255,.35);
    transition: color .18s var(--ease-out), text-shadow .18s var(--ease-out);
  }
  .timer.low {
    color: var(--danger);
    text-shadow: 0 0 10px rgba(255,59,92,.8), 0 0 26px rgba(255,59,92,.45);
    animation: timerPulse .9s ease-in-out infinite;
  }
  .score {
    font-family:"Orbitron", monospace;
    font-size: 19px;
    font-weight: 700;
    color: var(--ink);
    text-shadow: 0 0 8px rgba(168,85,247,.4);
  }
  .round-label {
    text-align: center;
    font-size: 13px;
    font-weight: 700;
    color: var(--ink-dim);
    text-transform: uppercase;
    letter-spacing: 2px;
    margin-bottom: 12px;
    animation: fadeSlide .24s var(--ease-out) both;
  }

  .board {
    display: grid;
    grid-template-columns: 1fr 1fr;
    align-items: stretch;
    align-content: start;
    gap: 10px;
    flex: 1;
  }

  .card {
    position:relative;
    border: 1.5px solid transparent;
    border-radius: 14px;
    padding: 16px 10px;
    font-family:"Rajdhani", sans-serif;
    font-size: 17px;
    font-weight: 600;
    letter-spacing: .3px;
    cursor: pointer;
    color: #fff;
    text-align: center;
    user-select: none;
    min-height: 56px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(18,24,40,.55);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    transition: transform .09s var(--spring), opacity .15s var(--ease-out),
                box-shadow .09s var(--ease-out), border-color .09s var(--ease-out),
                background .15s var(--ease-out);
    animation: cardIn .19s var(--ease-out) both;
  }
  .card.en {
    border-color: rgba(0,229,255,.55);
    box-shadow: 0 0 0 1px rgba(0,229,255,.15) inset,
                0 0 14px rgba(0,229,255,.28), 0 6px 18px rgba(0,0,0,.35);
  }
  .card.ru {
    border-color: rgba(255,45,120,.55);
    box-shadow: 0 0 0 1px rgba(255,45,120,.15) inset,
                0 0 14px rgba(255,45,120,.28), 0 6px 18px rgba(0,0,0,.35);
  }
  .card:active { transform: scale(.97); }
  .card.selected.en {
    border-color: var(--cyan);
    box-shadow: 0 0 0 2px rgba(0,229,255,.5) inset,
                0 0 22px rgba(0,229,255,.6), 0 0 40px rgba(0,229,255,.35);
    background: rgba(0,229,255,.10);
  }
  .card.selected.ru {
    border-color: var(--pink);
    box-shadow: 0 0 0 2px rgba(255,45,120,.5) inset,
                0 0 22px rgba(255,45,120,.6), 0 0 40px rgba(255,45,120,.35);
    background: rgba(255,45,120,.10);
  }
  .card.correct {
    animation: correctFlash .1s var(--ease-out) both;
  }
  .card.wrong {
    animation: wrongShake .1s cubic-bezier(.36,.07,.19,.97) both;
  }
  .card.gone { opacity: 0; pointer-events: none; transform: scale(.8); }
  .card.matched {
    background: rgba(255,255,255,.03) !important;
    color: var(--ink-dim);
    border-color: rgba(140,150,184,.18);
    cursor: default;
    box-shadow: none;
    opacity: .45;
    transform: none;
    animation: none;
  }
  .card.empty { visibility: hidden; pointer-events: none; box-shadow: none; }

  /* stagger entrance row by row (cards are laid out as left/right pairs) */
  .board .card:nth-child(1), .board .card:nth-child(2) { animation-delay:.02s; }
  .board .card:nth-child(3), .board .card:nth-child(4) { animation-delay:.06s; }
  .board .card:nth-child(5), .board .card:nth-child(6) { animation-delay:.10s; }
  .board .card:nth-child(7), .board .card:nth-child(8) { animation-delay:.14s; }
  .board .card:nth-child(9), .board .card:nth-child(10) { animation-delay:.18s; }

  @keyframes cardIn {
    0%   { opacity:0; transform: scale(.9) translateY(8px); }
    100% { opacity:1; transform: scale(1) translateY(0); }
  }
  @keyframes correctFlash {
    0%   { transform: scale(1); }
    35%  { transform: scale(1.08);
           box-shadow: 0 0 0 2px rgba(62,255,180,.7) inset,
                       0 0 30px rgba(62,255,180,.85), 0 0 60px rgba(0,229,255,.5);
           border-color:#3effb4; background: rgba(62,255,180,.16); }
    100% { transform: scale(1); opacity:.55;
           box-shadow: 0 0 14px rgba(62,255,180,.2); }
  }
  @keyframes wrongShake {
    0%,100% { transform: translateX(0); }
    15% { transform: translateX(-7px); border-color:var(--danger);
          box-shadow:0 0 22px rgba(255,59,92,.75); background:rgba(255,59,92,.14); }
    35% { transform: translateX(6px); box-shadow:0 0 26px rgba(255,59,92,.85); }
    55% { transform: translateX(-4px); }
    75% { transform: translateX(3px); border-color:var(--danger);
          box-shadow:0 0 20px rgba(255,59,92,.6); }
  }
  @keyframes timerPulse {
    0%,100% { transform: scale(1); }
    50%     { transform: scale(1.06); }
  }
  @keyframes fadeSlide {
    0%   { opacity:0; transform: translateY(14px); }
    100% { opacity:1; transform: translateY(0); }
  }
  @keyframes screenIn {
    0%   { opacity:0; transform: translateY(16px); }
    100% { opacity:1; transform: translateY(0); }
  }
  @keyframes btnBreathe {
    0%,100% { box-shadow: 0 0 0 1.5px rgba(255,255,255,.12) inset,
                          0 0 18px rgba(255,45,120,.4), 0 0 32px rgba(0,229,255,.25); }
    50%     { box-shadow: 0 0 0 1.5px rgba(255,255,255,.2) inset,
                          0 0 30px rgba(255,45,120,.7), 0 0 55px rgba(0,229,255,.5); }
  }

  .screen {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    gap: 16px;
    padding: 24px 8px;
    animation: screenIn .26s var(--ease-out) both;
  }
  .screen h1 {
    font-family:"Orbitron", sans-serif;
    font-size: 30px; margin: 0; font-weight:900; letter-spacing:1px;
    color: #fff;
    text-shadow: 0 0 12px rgba(255,45,120,.6), 0 0 28px rgba(0,229,255,.4);
  }
  .screen h2 {
    font-family:"Orbitron", sans-serif;
    font-size: 22px; margin: 0; font-weight:700; color: #fff;
    text-shadow: 0 0 10px rgba(0,229,255,.5);
  }
  .screen p { margin: 0; color: var(--ink-dim); font-size: 15px; line-height:1.45; max-width:340px; }
  .big-score {
    font-family:"Orbitron", monospace;
    font-size: 54px; font-weight: 900; color: var(--cyan);
    text-shadow: 0 0 16px rgba(0,229,255,.7), 0 0 40px rgba(0,229,255,.4);
  }

  .btn {
    position:relative;
    color: #fff;
    border: 1.5px solid rgba(255,255,255,.35);
    border-radius: 14px;
    padding: 15px 32px;
    font-family:"Rajdhani", sans-serif;
    font-size: 17px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1px;
    cursor: pointer;
    width: 100%;
    max-width: 280px;
    background: linear-gradient(100deg, var(--pink) 0%, var(--purple) 52%, var(--cyan) 100%);
    box-shadow: 0 0 18px rgba(255,45,120,.4), 0 0 30px rgba(0,229,255,.25),
                0 6px 20px rgba(0,0,0,.4);
    transition: transform .14s var(--spring), box-shadow .18s var(--ease-out), filter .18s var(--ease-out);
  }
  .btn:hover { filter: brightness(1.08);
    box-shadow: 0 0 28px rgba(255,45,120,.65), 0 0 48px rgba(0,229,255,.45), 0 6px 22px rgba(0,0,0,.4); }
  .btn:active { transform: scale(.97); }
  #startBtn { animation: btnBreathe 2s ease-in-out infinite; }
  #startBtn:hover { animation: none; }
  .btn.secondary {
    background: rgba(18,24,40,.5);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    color: var(--ink);
    border: 1.5px solid rgba(140,150,184,.35);
    box-shadow: 0 4px 16px rgba(0,0,0,.35);
  }
  .btn.secondary:hover { border-color: var(--cyan2);
    box-shadow: 0 0 18px rgba(0,229,255,.35), 0 4px 16px rgba(0,0,0,.35); filter:none; }
  .btn.small { padding: 10px 20px; font-size: 13px; text-transform:none; letter-spacing:.5px; }

  .reject-list {
    width: 100%;
    max-height: 260px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin: 8px 0;
  }
  .reject-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: rgba(255,255,255,.04);
    border:1px solid rgba(140,150,184,.16);
    border-radius: 12px;
    padding: 10px 14px;
    font-size: 15px;
    color: var(--ink);
  }
  .reject-item span { text-align: left; }
  .reject-item button {
    background: none;
    border: 1.5px solid rgba(140,150,184,.4);
    border-radius: 9px;
    padding: 5px 12px;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    color: var(--ink-dim);
    transition: all .15s var(--ease-out);
  }
  .reject-item button.marked {
    background: rgba(255,59,92,.16);
    border-color: var(--danger);
    color: #fff;
    box-shadow: 0 0 14px rgba(255,59,92,.4);
  }

  .settings-panel { width: 100%; text-align: left; }
  .settings-panel h3 { font-size: 15px; margin: 14px 0 6px; color: var(--ink); font-weight:700; }
  .settings-panel .row { display: flex; gap: 8px; margin-bottom: 8px; }
  .settings-panel input, .settings-panel textarea {
    flex: 1;
    border: 1.5px solid rgba(140,150,184,.3);
    border-radius: 11px;
    padding: 11px 13px;
    font-size: 14px;
    font-family: inherit;
    background: rgba(10,14,26,.6);
    color: var(--ink);
    transition: border-color .15s var(--ease-out), box-shadow .15s var(--ease-out);
  }
  .settings-panel input::placeholder, .settings-panel textarea::placeholder { color: rgba(140,150,184,.6); }
  .settings-panel input:focus, .settings-panel textarea:focus {
    outline:none; border-color: var(--cyan2);
    box-shadow: 0 0 14px rgba(0,229,255,.3);
  }
  .settings-panel textarea { width: 100%; min-height: 80px; resize: vertical; }
  .word-list { max-height: 150px; overflow-y: auto; margin-bottom: 8px; }
  .word-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 7px 0;
    border-bottom: 1px solid rgba(140,150,184,.12);
    font-size: 13px;
    color: var(--ink);
  }
  .word-row button {
    background: none;
    border: none;
    color: var(--danger);
    font-weight: 700;
    cursor: pointer;
    font-size: 13px;
  }
  .tabs { display: flex; gap: 6px; margin-bottom: 10px; }
  .tabs button {
    flex: 1;
    padding: 9px;
    border: 1.5px solid rgba(140,150,184,.3);
    background: rgba(18,24,40,.5);
    border-radius: 11px;
    font-family:"Rajdhani", sans-serif;
    font-weight: 700;
    font-size: 12px;
    cursor: pointer;
    color: var(--ink-dim);
    transition: all .16s var(--ease-out);
  }
  .tabs button.active {
    border-color: var(--cyan);
    color: #fff;
    background: rgba(0,229,255,.12);
    box-shadow: 0 0 16px rgba(0,229,255,.35), 0 0 0 1px rgba(0,229,255,.2) inset;
  }
  .stat-line { font-size: 13px; color: var(--ink-dim); margin-bottom: 6px; }

  .source-picker { display:flex; flex-wrap:wrap; gap:8px; justify-content:center; max-width:320px; width:100%; }
  .src-chip {
    border: 1.5px solid rgba(140,150,184,.3);
    background: rgba(18,24,40,.5);
    border-radius: 999px;
    padding: 8px 14px;
    font-family:"Rajdhani", sans-serif;
    font-weight: 700;
    font-size: 13px;
    cursor: pointer;
    color: var(--ink-dim);
    transition: all .16s var(--ease-out);
    display:flex; align-items:center; gap:6px;
  }
  .src-chip .src-count { font-size:11px; opacity:.75; }
  .src-chip.active {
    border-color: var(--pink2);
    color: #fff;
    background: linear-gradient(100deg, rgba(255,45,120,.22), rgba(0,229,255,.16));
    box-shadow: 0 0 14px rgba(255,45,120,.35), 0 0 0 1px rgba(255,45,120,.2) inset;
  }
  .src-chip:active { transform: scale(.95); }

  .record-card {
    width: 100%;
    max-width: 280px;
    background:
      linear-gradient(135deg, rgba(255,45,120,.12), rgba(0,229,255,.10));
    border: 1.5px solid rgba(255,79,216,.5);
    border-radius: 16px;
    padding: 14px 16px;
    margin-bottom: 4px;
    text-align: center;
    box-shadow: 0 0 20px rgba(255,45,120,.22), inset 0 0 20px rgba(0,229,255,.06);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
  }
  .record-card .stars {
    font-size: 22px;
    color: #FFC800;
    letter-spacing: 4px;
    line-height: 1;
    margin-bottom: 4px;
    text-shadow: 0 0 10px rgba(255,200,0,.6);
  }
  .record-card .record-main {
    font-family:"Orbitron", sans-serif;
    font-size: 24px;
    font-weight: 800;
    color: #fff;
    text-shadow: 0 0 12px rgba(0,229,255,.4);
  }
  .record-card .record-sub {
    font-size: 13px;
    color: var(--ink-dim);
    margin-top: 3px;
  }
  .record-card.empty {
    background: rgba(255,255,255,.03);
    border: 1.5px dashed rgba(140,150,184,.3);
    box-shadow:none;
  }
  .record-card.empty .record-main { color: var(--ink-dim); font-size: 15px; font-weight: 700; text-shadow:none; font-family:"Rajdhani",sans-serif; }
  .hidden { display: none !important; }

  /* ---------- Puzzle (achievements) ---------- */
  .puzzle-grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 4px;
    width: 100%;
    max-width: 300px;
    margin: 4px auto;
    padding: 8px;
    border-radius: 14px;
    background: rgba(255,255,255,.03);
    border: 1px solid rgba(140,150,184,.16);
  }
  .puzzle-cell {
    position: relative;
    aspect-ratio: 768 / 580;
    border-radius: 5px;
    background-color: rgba(255,255,255,.02);
  }
  .puzzle-cell.locked {
    border: 1.5px dashed rgba(140,150,184,.28);
    background: transparent;
  }
  .puzzle-cell.unlocked {
    box-shadow: 0 0 0 1px rgba(0,229,255,.35) inset, 0 0 10px rgba(0,229,255,.25);
    animation: cellReveal .3s var(--ease-out) both;
  }
  @keyframes cellReveal {
    0%   { opacity: 0; transform: scale(.7) rotate(-6deg); filter: brightness(2); }
    60%  { opacity: 1; transform: scale(1.08) rotate(2deg); }
    100% { opacity: 1; transform: scale(1) rotate(0); filter: brightness(1); }
  }

  .piece-reward {
    width: 100%;
    max-width: 300px;
    background: linear-gradient(135deg, rgba(0,229,255,.1), rgba(255,45,120,.1));
    border: 1.5px solid rgba(0,229,255,.4);
    border-radius: 16px;
    padding: 14px;
    box-shadow: 0 0 24px rgba(0,229,255,.2);
  }
  .piece-reward-title {
    font-family: "Orbitron", sans-serif;
    font-size: 14px;
    font-weight: 700;
    color: #fff;
    text-shadow: 0 0 10px rgba(0,229,255,.6);
    margin-bottom: 8px;
    text-transform: uppercase;
    letter-spacing: .5px;
  }
  .piece-reward-row { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; }
  .piece-reward-row .puzzle-cell { width: 62px; height: auto; aspect-ratio: 768 / 580; flex: none; }
  .piece-pop {
    animation: piecePop .55s var(--spring) both;
  }
  @keyframes piecePop {
    0%   { opacity: 0; transform: scale(.3) rotate(-25deg) translateY(14px);
           box-shadow: 0 0 0 rgba(0,229,255,0); }
    55%  { opacity: 1; transform: scale(1.18) rotate(6deg) translateY(-4px);
           box-shadow: 0 0 24px rgba(0,229,255,.8), 0 0 40px rgba(255,45,120,.5); }
    100% { opacity: 1; transform: scale(1) rotate(0) translateY(0);
           box-shadow: 0 0 10px rgba(0,229,255,.3); }
  }

  /* neon scrollbars */
  .reject-list::-webkit-scrollbar, .word-list::-webkit-scrollbar { width:6px; }
  .reject-list::-webkit-scrollbar-thumb, .word-list::-webkit-scrollbar-thumb {
    background: rgba(0,229,255,.35); border-radius: 3px;
  }

  /* completed pictures gallery */
  .collected-title { font-family:"Orbitron",sans-serif; font-size:13px; font-weight:700; color:#ffe6a3; margin:18px 0 10px; letter-spacing:.5px; text-shadow:0 0 12px rgba(255,200,0,.4); }
  .collected-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:14px; width:100%; max-width:340px; }
  .collected-card { position:relative; border:none; cursor:pointer; padding:7px; border-radius:13px; background:linear-gradient(135deg,#6a4f11,#3a2c08); box-shadow:0 0 0 2px #ffd24a inset,0 0 16px rgba(255,200,0,.45),0 6px 18px rgba(0,0,0,.45); display:flex; flex-direction:column; gap:7px; align-items:center; margin-top:8px; transition:transform .2s var(--spring),box-shadow .2s var(--ease-out); animation:cellReveal .45s var(--spring) both; }
  .collected-card:hover, .collected-card:active { transform:scale(1.05); box-shadow:0 0 0 2px #ffe27a inset,0 0 28px rgba(255,200,0,.75),0 6px 22px rgba(0,0,0,.55); }
  .collected-img { display:block; width:100%; aspect-ratio:768/580; border-radius:8px; background-size:cover; background-position:center; box-shadow:0 0 0 1px rgba(0,0,0,.45) inset; }
  .collected-card .crown { position:absolute; top:-13px; left:50%; transform:translateX(-50%); font-size:23px; filter:drop-shadow(0 0 7px rgba(255,200,0,.95)); z-index:2; }
  .collected-label { font-family:"Rajdhani",sans-serif; font-size:12px; font-weight:700; color:#ffe6a3; letter-spacing:.3px; }

  /* picture view + download modal */
  .pic-modal { position:fixed; inset:0; z-index:50; display:flex; align-items:center; justify-content:center; padding:20px; background:rgba(6,8,16,.82); backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px); animation:fadeSlide .22s var(--ease-out) both; }
  .pic-modal-box { width:100%; max-width:440px; background:linear-gradient(160deg,#141a2c,#0c0814); border:1.5px solid #ffd24a; border-radius:16px; padding:16px; box-shadow:0 0 0 3px rgba(255,200,0,.25),0 0 40px rgba(255,200,0,.3); display:flex; flex-direction:column; gap:12px; animation:piecePop .5s var(--spring) both; }
  .pic-modal-head { font-family:"Orbitron",sans-serif; font-size:15px; font-weight:800; color:#ffe6a3; text-align:center; text-shadow:0 0 12px rgba(255,200,0,.5); }
  .pic-modal-img { width:100%; border-radius:10px; display:block; box-shadow:0 0 20px rgba(0,229,255,.25); }
  .pic-modal-actions { display:flex; gap:10px; }
  .pic-modal-actions .btn { flex:1; max-width:none; text-decoration:none; text-align:center; padding:12px 10px; }
</style>
</head>
<body>
<div class="app" id="app"></div>

<script>
(function () {

  // ---------- Source selection (multi-select: any combo of a1/a2/b1/b2/custom) ----------
  var LS_SOURCES = "mm_selected_sources";
  function loadSelectedSources() {
    try {
      var raw = JSON.parse(localStorage.getItem(LS_SOURCES) || "null");
      if (Array.isArray(raw) && raw.length) return raw;
    } catch (e) {}
    return ["a1"]; // sensible default for a fresh install
  }
  function saveSelectedSources(list) {
    localStorage.setItem(LS_SOURCES, JSON.stringify(list));
  }
  function toggleSource(key) {
    var list = loadSelectedSources();
    var idx = list.indexOf(key);
    if (idx >= 0) {
      if (list.length === 1) return; // keep at least one source selected
      list.splice(idx, 1);
    } else {
      list.push(key);
    }
    saveSelectedSources(list);
  }

  function getActiveWordPool() {
    var rejected = loadRejected();
    var rejectedKeys = {};
    rejected.forEach(function (w) { rejectedKeys[w.en.toLowerCase()] = true; });

    var selected = loadSelectedSources();
    var all = [];
    selected.forEach(function (key) {
      if (key === "custom") all = all.concat(loadCustomWords());
      else if (LEVEL_WORDS[key]) all = all.concat(LEVEL_WORDS[key]);
    });

    return all.filter(function (w) { return !rejectedKeys[w.en.toLowerCase()]; });
  }

  function shuffle(arr) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
    }
    return a;
  }

  var MAX_TOTAL_PIECES = PUZZLE_IMAGES.length * PUZZLE_PIECES; // caps progress at 3 full pictures

  // Picture 1 is always earnable. Picture 2 requires at least "Элементарный"
  // (A2) selected as a word source right now; picture 3 requires at least
  // "Средний" (B1). This is checked against the CURRENT source selection, not

  var LEVEL_TIER = { a1: 0, a2: 1, b1: 2, b2: 3, c1: 4 };
  function currentLevelTier() {
    var selected = loadSelectedSources();
    var maxTier = 0; // "custom"-only (or nothing recognized) behaves like A1: picture 1 only
    selected.forEach(function (key) {

  function piecesCapForCurrentLevel() {
    var tier = currentLevelTier();
    if (tier >= LEVEL_TIER.b1) return MAX_TOTAL_PIECES;      // B1+ unlocks all 3 pictures
    if (tier >= LEVEL_TIER.a2) return PUZZLE_PIECES * 2;      // A2 unlocks pictures 1-2
    return PUZZLE_PIECES;                                     // A1 (or custom only) unlocks picture 1
  }
  function globalPiecesUnlocked() {
    var raw = Math.floor(loadLifetimeScore() / PUZZLE_STEP);
    var cap = Math.min(MAX_TOTAL_PIECES, piecesCapForCurrentLevel());

  }
  function allPicturesCollected() {
    return globalPiecesUnlocked() >= MAX_TOTAL_PIECES;
  }
  function currentPictureIndex() {
    return Math.min(completedPicturesCount(), PUZZLE_IMAGES.length - 1);
  }
  function currentPiecesUnlocked() {
    if (allPicturesCollected()) return PUZZLE_PIECES;
    return globalPiecesUnlocked() % PUZZLE_PIECES;
  }
  function puzzleImageFor(pictureIndex) {
    return PUZZLE_IMAGES[pictureIndex % PUZZLE_IMAGES.length];
  }
  function loadPerms() {
    try { var r = JSON.parse(localStorage.getItem(LS_PUZZLE_PERMS) || "null"); if (Array.isArray(r)) return r; } catch (e) {}
    return [];
  }
  function savePerms(a) { localStorage.setItem(LS_PUZZLE_PERMS, JSON.stringify(a)); }
  function getPerm(pictureIndex) {
    var perms = loadPerms();
    if (!Array.isArray(perms[pictureIndex]) || perms[pictureIndex].length !== PUZZLE_PIECES) {
      var p = [];
      for (var i = 0; i < PUZZLE_PIECES; i++) p.push(i);
      p = shuffle(p);
      perms[pictureIndex] = p;
      savePerms(perms);
    }
    return perms[pictureIndex];
  }
  // Call with the CURRENT round score (not points to add). Only advances the
  // best-ever score, and only unlocks pieces if that pushes past a new 2000-point
  // threshold. Returns array of {picture, cell} unlocked this call (for reveal).
  function updateBestRoundScore(currentRoundScore) {
    var prevBest = loadLifetimeScore();
    if (currentRoundScore <= prevBest) return [];
    var cap = Math.min(MAX_TOTAL_PIECES, piecesCapForCurrentLevel());
    var before = Math.min(cap, Math.floor(prevBest / PUZZLE_STEP));
    saveLifetimeScore(currentRoundScore);
    var after = Math.min(cap, Math.floor(currentRoundScore / PUZZLE_STEP));
    var just = [];
    for (var g = before; g < after; g++) {
      var pic = Math.floor(g / PUZZLE_PIECES);
      var perm = getPerm(pic);
      just.push({ picture: pic, cell: perm[g % PUZZLE_PIECES] });
    }
    return just;
  }
  function currentUnlockedCells() {
    var perm = getPerm(currentPictureIndex());
    var count = currentPiecesUnlocked();
    var set = {};
    for (var i = 0; i < count; i++) set[perm[i]] = true;
    return set;
  }

  var LS_RECORD = "mm_best_record";

  function loadRecord() {
    try { return JSON.parse(localStorage.getItem(LS_RECORD) || "null"); } catch (e) { return null; }
  }
  function saveRecord(rec) {
    localStorage.setItem(LS_RECORD, JSON.stringify(rec));
  }
  function pluralWords(n) {
    var n10 = n % 10, n100 = n % 100;
    if (n10 === 1 && n100 !== 11) return n + " слово";
    if (n10 >= 2 && n10 <= 4 && (n100 < 10 || n100 >= 20)) return n + " слова";
    return n + " слов";
  }
  function starsFor(matched) {
    if (matched >= 30) return 3;
    if (matched >= 15) return 2;
    if (matched >= 5) return 1;
    return 0;
  }
  function starsHtml(count) {
    var html = "";
    for (var i = 0; i < 3; i++) {
      html += i < count ? "★" : "☆";
    }
    return html;
  }
  function formatDateTime(d) {
    var pad = function (n) { return n < 10 ? "0" + n : "" + n; };
    return pad(d.getDate()) + "." + pad(d.getMonth() + 1) + "." + d.getFullYear() +
      " " + pad(d.getHours()) + ":" + pad(d.getMinutes());
  }

  var state = {
    screen: "home", // home, playing, gameOver, settings
    timeLeft: START_TIME,
    score: 0,
    matchedCount: 0,
    timerHandle: null,
    poolQueue: [],
    idCounter: 0,
    usedWords: [], // words used this whole game session {en, ru}
    board: [], // current cycle entries: {id, en, ru, matched}
    rightOrder: [], // ids in shuffled order, fixed for the current cycle
    selectedLeft: null,
    selectedRight: null,
    busy: false,
    settingsTab: "add",
    sessionNewPieces: [],
    paused: false
  };

  var app = document.getElementById("app");

  function render() {
    if (state.screen === "home") return renderHome();
    if (state.screen === "playing") return renderPlaying();
    if (state.screen === "gameOver") return renderGameOver();
    if (state.screen === "settings") return renderSettings();
    if (state.screen === "achievements") return renderAchievements();
  }

  // ---------- Puzzle artwork ----------
  // Single neon illustration sliced into a 5x4 grid; no external file needed.
  // puzzle images defined above as PUZZLE_IMAGES

  // ---------- HOME ----------
  function renderHome() {
    var record = loadRecord();

    if (record) {
      var stars = starsFor(record.matched);
      recordHtml =
        '<div class="record-card">' +

        '</div>';
    } else {
      recordHtml = '<div class="record-card empty"><div class="record-main">Рекордов пока нет - сыграй первую игру</div></div>';

            LEVEL_LABELS[key] + ' <span class="src-count">' + LEVEL_WORDS[key].length + '</span></button>';
        }).join("") +

      '</div>';

    var pool = getActiveWordPool();

    app.innerHTML =
      '<div class="screen">' +
        '<h1>Match Madness</h1>' +

        recordHtml +
        '<p style="margin-top:4px;">Выбери одну или несколько баз слов:</p>' +
        sourcePickerHtml +
        '<div class="stat-line" id="poolCountLine">Слов в игре: ' + pool.length + '</div>' +
        '<button class="btn" id="startBtn">Начать</button>' +
        '<button class="btn secondary" id="achievementsBtn">🧩 Достижения (' + (allPicturesCollected() ? "все " + PUZZLE_IMAGES.length + " картины!" : "картина " + (currentPictureIndex() + 1) + " · " + currentPiecesUnlocked() + "/" + PUZZLE_PIECES) + ')</button>' +
        '<button class="btn secondary" id="settingsBtn">Настройки слов</button>' +
      '</div>';

    Array.prototype.forEach.call(document.querySelectorAll(".src-chip"), function (btn) {
      btn.onclick = function () {
        toggleSource(btn.getAttribute("data-src"));
        render();

    });

    document.getElementById("startBtn").onclick = startGame;
    document.getElementById("achievementsBtn").onclick = function () {

    document.getElementById("settingsBtn").onclick = function () {

  // ---------- ACHIEVEMENTS (all-time puzzle) ----------
  function puzzleCellStyle(index, image) {
    var col = index % PUZZLE_COLS;
    var row = Math.floor(index / PUZZLE_COLS);
    var posX = (col / (PUZZLE_COLS - 1)) * 100;
    var posY = (row / (PUZZLE_ROWS - 1)) * 100;
    return 'background-image:url(' + image + ');' +
      'background-size:' + (PUZZLE_COLS * 100) + '% ' + (PUZZLE_ROWS * 100) + '%;' +
      'background-position:' + posX + '% ' + posY + '%;';
  }

  function renderAchievements() {
    var total = loadLifetimeScore();
    var picIndex = currentPictureIndex();
    var image = puzzleImageFor(picIndex);
    var unlocked = currentUnlockedCells();
    var count = currentPiecesUnlocked();
    var completed = completedPicturesCount();
    var allDone = allPicturesCollected();
    var toNext = (globalPiecesUnlocked() + 1) * PUZZLE_STEP - total;
    var cap = piecesCapForCurrentLevel();
    var levelLocked = !allDone && globalPiecesUnlocked() >= cap && cap < MAX_TOTAL_PIECES;
    var neededLevelLabel = cap === PUZZLE_PIECES ? LEVEL_LABELS.a2 : LEVEL_LABELS.b1;

    var cellsHtml = "";
    for (var i = 0; i < PUZZLE_PIECES; i++) {
      if (unlocked[i]) cellsHtml += '<div class="puzzle-cell unlocked" style="' + puzzleCellStyle(i, image) + '"></div>';
      else cellsHtml += '<div class="puzzle-cell locked"></div>';
    }

    var collectedHtml = "";
    if (completed > 0) {
      var cards = "";
      for (var c = 0; c < completed; c++) {
        var img = puzzleImageFor(c);
        cards += '<button class="collected-card" data-img="' + img + '" data-num="' + (c + 1) + '">' +
          '<span class="crown">👑</span>' +
          '<span class="collected-img" style="background-image:url(' + img + ');"></span>' +
          '<span class="collected-label">Картина ' + (c + 1) + '</span>' +
          '</button>';
      }
      collectedHtml =
        '<div class="collected-title">Собранные картины (' + completed + ' из ' + PUZZLE_IMAGES.length + ')</div>' +
        '<div class="collected-grid">' + cards + '</div>';
    }

    var introHtml, statHtml, gridHtml;
    if (allDone) {
      introHtml = '<p>Собрана вся коллекция — все ' + PUZZLE_IMAGES.length + ' картины готовы. Новые кусочки больше не открываются, но можно ставить личные рекорды дальше.</p>';
      statHtml = '<div class="stat-line">Лучший результат за раунд: ' + total + ' очков</div>';
      gridHtml = "";
    } else if (levelLocked) {
      introHtml = '<p>Картина №' + (picIndex + 1) + ' из ' + PUZZLE_IMAGES.length + ' пока заблокирована: включи базу «' + neededLevelLabel + '» или выше в настройках, чтобы открывать её кусочки. Очки ты уже набрал(а) — они посчитаются, как только выберешь нужный уровень.</p>';
      statHtml = '<div class="stat-line">Лучший результат за раунд: ' + total + ' очков</div>';
      gridHtml = '<div class="puzzle-grid">' + cellsHtml + '</div>';
    } else {
      introHtml = '<p>Собери ' + count + ' из ' + PUZZLE_PIECES + ' кусочков картины №' + (picIndex + 1) + ' из ' + PUZZLE_IMAGES.length + '. Новый кусочек открывается за каждые ' + PUZZLE_STEP + ' очков личного рекорда в одном раунде.</p>' +
        '<p>До следующего кусочка: ' + toNext + ' очков.</p>';
      statHtml = '<div class="stat-line">Лучший результат за раунд: ' + total + ' очков</div>';
      gridHtml = '<div class="puzzle-grid">' + cellsHtml + '</div>';
    }

    app.innerHTML =
      '<div class="screen" style="justify-content:flex-start;">' +
        '<h2>🧩 Достижения</h2>' +
        introHtml +
        gridHtml +
        statHtml +
        collectedHtml +
        '<button class="btn secondary" id="backBtn">Назад</button>' +
      '</div>';

    document.getElementById("backBtn").onclick = function () {
      state.screen = "home";
      render();
    };
    Array.prototype.forEach.call(document.querySelectorAll(".collected-card"), function (btn) {
      btn.onclick = function () {
        openPictureModal(btn.getAttribute("data-img"), btn.getAttribute("data-num"));
      };
    });
  }

  function openPictureModal(img, num) {
    var overlay = document.createElement("div");
    overlay.className = "pic-modal";
    overlay.innerHTML =
      '<div class="pic-modal-box">' +
        '<div class="pic-modal-head"><span class="crown">👑</span> Картина ' + num + ' собрана</div>' +
        '<img class="pic-modal-img" src="' + img + '" alt="Картина ' + num + '">' +
        '<div class="pic-modal-actions">' +
          '<a class="btn" href="' + img + '" download="match-madness-' + num + '.jpg">Скачать</a>' +
          '<button class="btn secondary" data-close="1">Закрыть</button>' +
        '</div>' +
      '</div>';
    overlay.addEventListener("click", function (e) {
      var t = e.target;
      if (t === overlay || (t.getAttribute && t.getAttribute("data-close"))) overlay.remove();
    });
    document.body.appendChild(overlay);
  }

  function startGame() {
    var pool = getActiveWordPool();
    if (pool.length < CYCLE_SIZE) {
      alert("Нужно минимум " + CYCLE_SIZE + " слов в базе, чтобы начать игру. Сейчас: " + pool.length);
      return;
    }
    state.poolQueue = shuffle(pool);
    state.idCounter = 0;
    state.timeLeft = START_TIME;
    state.score = 0;
    state.matchedCount = 0;
    state.usedWords = [];
    state.selectedLeft = null;
    state.selectedRight = null;
    state.busy = false;
    state.sessionNewPieces = [];
    state.paused = false;
    state.screen = "playing";

    startCycle();
    render();
    startTimer();
  }

  // ---------- PLAYING ----------
  function nextWordsFromPool(count) {
    var activePool = getActiveWordPool();
    var words = [];
    for (var i = 0; i < count; i++) {
      if (state.poolQueue.length === 0) {
        state.poolQueue = shuffle(activePool);
      }
      words.push(state.poolQueue.shift());
    }
    return words;
  }

  function startCycle() {
    var words = nextWordsFromPool(CYCLE_SIZE);
    words.forEach(function (w) {
      var already = state.usedWords.some(function (u) { return u.en === w.en; });
      if (!already) state.usedWords.push(w);
    });
    state.board = words.map(function (w) {
      return { id: state.idCounter++, en: w.en, ru: w.ru, matched: false };
    });
    state.rightOrder = shuffle(state.board.map(function (c) { return c.id; }));
    state.selectedLeft = null;
    state.selectedRight = null;
    state.busy = false;
  }

  // Timer ticks twice as fast as real time (500ms per displayed second), so
  // START_TIME/TIME_BONUS/TIME_PENALTY are all in "game seconds": divide by 2
  // for the real-world duration (120 game sec = 60 real sec, 5 = 2.5, 15 = 7.5).
  var TICK_MS = 500;
  function startTimer() {
    if (state.timerHandle) clearInterval(state.timerHandle);
    state.timerHandle = setInterval(function () {
      state.timeLeft -= 1;
      updateTimerDisplay();
      if (state.timeLeft <= 0) {
        clearInterval(state.timerHandle);
        state.timeLeft = 0;
        timeUp();
      }
    }, TICK_MS);
  }

  function stopTimer() {
    if (state.timerHandle) {
      clearInterval(state.timerHandle);
      state.timerHandle = null;
    }
  }

  function updateTimerDisplay() {
    var el = document.getElementById("timerDisplay");
    if (!el) return;
    var m = Math.floor(state.timeLeft / 60);
    var s = state.timeLeft % 60;
    el.textContent = (m < 10 ? "0" : "") + m + ":" + (s < 10 ? "0" : "") + s;
    el.classList.toggle("low", state.timeLeft <= 10);
  }

  function timeUp() {
    state.gameOverReason = "time";
    endGame();
  }

  function renderPlaying() {
    var byId = {};
    state.board.forEach(function (c) { byId[c.id] = c; });
    var rightItems = state.rightOrder.map(function (id) { return byId[id]; });

    // Rows are built as left/right pairs (not two separate columns) so a long
    // wrapped translation on one side pushes both cards in that row to the
    // same height, keeping every row aligned across the two columns.
    var rowsHtml = state.board.map(function (c, i) {
      var r = rightItems[i];
      var leftCard = '<button class="card en' + (c.matched ? ' matched' : '') + '" data-side="left" data-id="' + c.id + '"' + (c.matched ? ' disabled' : '') + '>' + escapeHtml(c.en) + '</button>';
      var rightCard = '<button class="card ru' + (r.matched ? ' matched' : '') + '" data-side="right" data-id="' + r.id + '"' + (r.matched ? ' disabled' : '') + '>' + escapeHtml(r.ru) + '</button>';
      return leftCard + rightCard;
    }).join("");

    var pauseOverlayHtml = state.paused ?
      '<div id="pauseOverlay" style="position:absolute;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:rgba(10,14,26,.88);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);">' +
        '<div style="font-family:\'Orbitron\',sans-serif;font-size:20px;font-weight:800;color:#fff;text-shadow:0 0 12px rgba(0,229,255,.5);">Пауза</div>' +
        '<button class="btn" id="resumeBtn" style="width:auto;padding:12px 28px;">Продолжить</button>' +
      '</div>' : '';

    app.innerHTML =
      '<div class="topbar">' +
        '<div class="timer" id="timerDisplay" style="cursor:pointer;"></div>' +
        '<div style="display:flex;align-items:center;gap:6px;">' +
          '<button id="exitToHomeBtn" aria-label="Выйти в меню" style="background:none;border:none;color:rgba(140,150,184,.3);font-size:11px;cursor:pointer;padding:4px;line-height:1;">←</button>' +
          '<div class="score" id="scoreDisplay">' + state.score + ' очк.</div>' +
        '</div>' +
      '</div>' +
      '<div class="round-label">Смэтчено: ' + state.matchedCount + '</div>' +
      '<div class="board">' + rowsHtml + '</div>' +
      pauseOverlayHtml;

    updateTimerDisplay();

    Array.prototype.forEach.call(document.querySelectorAll(".card"), function (btn) {
      btn.onclick = onCardClick;
    });

    document.getElementById("exitToHomeBtn").onclick = function () {
      stopTimer();
      state.screen = "home";
      render();
    };

    document.getElementById("timerDisplay").onclick = function () {
      if (state.paused) return; // resuming happens via the overlay button only
      stopTimer();
      state.paused = true;
      render();
    };

    if (state.paused) {
      document.getElementById("resumeBtn").onclick = function () {
        state.paused = false;
        render();
        startTimer();
      };
    }
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function onCardClick(e) {
    var btn = e.currentTarget;
    var side = btn.getAttribute("data-side");
    var id = parseInt(btn.getAttribute("data-id"), 10);

    if (btn.classList.contains("matched")) return;
    if (btn.disabled) return;

    var currentlySelectedId = side === "left" ? state.selectedLeft : state.selectedRight;
    if (currentlySelectedId === id && btn.classList.contains("selected")) {
      // Tapping the already-selected card again deselects it.
      btn.classList.remove("selected");
      if (side === "left") state.selectedLeft = null;
      else state.selectedRight = null;
      return;
    }

    Array.prototype.forEach.call(document.querySelectorAll(".card[data-side='" + side + "']"), function (b) {
      b.classList.remove("selected");
    });
    btn.classList.add("selected");

    if (side === "left") state.selectedLeft = id;
    else state.selectedRight = id;

    if (state.selectedLeft !== null && state.selectedRight !== null) {
      checkMatch();
    }
  }

  // No "busy" lock: game state (matched/selected) updates instantly so the
  // next pair can be tapped right away. The flash/shake animation is purely
  // cosmetic and plays on top without blocking input.
  function checkMatch() {
    var leftId = state.selectedLeft;
    var rightId = state.selectedRight;
    var leftBtn = document.querySelector(".card[data-side='left'][data-id='" + leftId + "']");
    var rightBtn = document.querySelector(".card[data-side='right'][data-id='" + rightId + "']");

    var isMatch = leftId === rightId;
    state.selectedLeft = null;
    state.selectedRight = null;

    if (isMatch) {
      state.score += SCORE_CORRECT;
      state.matchedCount += 1;
      state.timeLeft = Math.min(MAX_TIME, state.timeLeft + TIME_BONUS);
      var justUnlocked = updateBestRoundScore(state.score);
      if (justUnlocked.length) state.sessionNewPieces = state.sessionNewPieces.concat(justUnlocked);

      var item = state.board.filter(function (c) { return c.id === leftId; })[0];
      if (item) item.matched = true;
      leftBtn.classList.remove("selected");
      rightBtn.classList.remove("selected");
      leftBtn.classList.add("correct");
      rightBtn.classList.add("correct");
      leftBtn.disabled = true;
      rightBtn.disabled = true;
      updateTimerDisplay();
      updateScoreDisplay();

      // Purely cosmetic swap from the flash to the dimmed "matched" look.
      setTimeout(function () {
        leftBtn.classList.remove("correct");
        rightBtn.classList.remove("correct");
        leftBtn.classList.add("matched");
        rightBtn.classList.add("matched");
      }, 100);

      var allMatched = state.board.every(function (c) { return c.matched; });
      if (allMatched) {
        setTimeout(function () {
          startCycle();
          render();
        }, 80);
      }
    } else {
      state.score = Math.max(0, state.score - SCORE_WRONG);
      state.timeLeft = Math.max(0, state.timeLeft - TIME_PENALTY);
      leftBtn.classList.add("wrong");
      rightBtn.classList.add("wrong");
      updateTimerDisplay();
      updateScoreDisplay();
      if (state.timeLeft <= 0) {
        setTimeout(function () {
          stopTimer();
          timeUp();
        }, 80);
        return;
      }
      setTimeout(function () {
        leftBtn.classList.remove("selected", "wrong");
        rightBtn.classList.remove("selected", "wrong");
      }, 100);
    }
  }

  function updateScoreDisplay() {
    var el = document.getElementById("scoreDisplay");
    if (el) el.textContent = state.score + " очк.";
  }

  function endGame() {
    stopTimer();
    state.screen = "gameOver";

    var record = loadRecord();
    state.isNewRecord = !record || state.matchedCount > record.matched;
    if (state.isNewRecord) {
      saveRecord({ matched: state.matchedCount, score: state.score, date: formatDateTime(new Date()) });
    }

    render();
  }

  function renderGameOver() {
    var reason = state.gameOverReason === "time" ? "Время вышло!" : "Игра завершена!";
    var usedWords = state.usedWords;
    var rejectedNow = {};

    var listHtml = usedWords.map(function (w, i) {
      return '<div class="reject-item">' +
        '<span>' + escapeHtml(w.en) + ' - ' + escapeHtml(w.ru) + '</span>' +
        '<button data-idx="' + i + '">Убрать</button>' +
        '</div>';
    }).join("");

    app.innerHTML =
      '<div class="screen">' +
        '<h1>' + reason + '</h1>' +
        '<div class="stars" style="font-size:28px;">' + starsHtml(starsFor(state.matchedCount)) + '</div>' +
        '<div class="big-score">' + state.score + '</div>' +
        '<p>Итоговый счёт — смэтчено ' + pluralWords(state.matchedCount) + '</p>' +
        (state.isNewRecord ? '<p style="color:#58CC02;font-weight:800;">Новый рекорд!</p>' : '') +
        (state.sessionNewPieces.length ? (
          '<div class="piece-reward">' +
            '<div class="piece-reward-title">' + (state.sessionNewPieces.length > 1 ? 'Новые кусочки пазла!' : 'Новый кусочек пазла!') + '</div>' +
            '<div class="piece-reward-row">' +
              state.sessionNewPieces.map(function (p, i) {
                return '<div class="puzzle-cell unlocked piece-pop" style="' + puzzleCellStyle(p.cell, puzzleImageFor(p.picture)) + 'animation-delay:' + (i * 0.12) + 's;"></div>';
              }).join("") +
            '</div>' +
            '<button class="btn small secondary" id="viewPuzzleBtn" style="width:auto;margin-top:6px;">Смотреть пазл (' + currentPiecesUnlocked() + '/' + PUZZLE_PIECES + ')</button>' +
          '</div>'
        ) : '') +
        (usedWords.length ? (
          '<p style="margin-top:8px;">Отметь слова, которые не зашли - они больше не будут появляться:</p>' +
          '<div class="reject-list">' + listHtml + '</div>'
        ) : '') +
        '<button class="btn" id="playAgainBtn">Играть снова</button>' +
        '<button class="btn secondary" id="homeBtn">На главную</button>' +
      '</div>';

    Array.prototype.forEach.call(document.querySelectorAll(".reject-item button"), function (btn) {
      btn.onclick = function () {
        var idx = parseInt(btn.getAttribute("data-idx"), 10);
        var w = usedWords[idx];
        var key = w.en.toLowerCase();
        if (rejectedNow[key]) {
          delete rejectedNow[key];
          btn.classList.remove("marked");
          btn.textContent = "Убрать";
        } else {
          rejectedNow[key] = w;
          btn.classList.add("marked");
          btn.textContent = "Убрано";
        }
      };
    });

    document.getElementById("playAgainBtn").onclick = function () {
      commitRejected(rejectedNow);
      startGame();
    };
    document.getElementById("homeBtn").onclick = function () {
      commitRejected(rejectedNow);
      state.screen = "home";
      render();
    };
    var viewPuzzleBtn = document.getElementById("viewPuzzleBtn");
    if (viewPuzzleBtn) {
      viewPuzzleBtn.onclick = function () {
        commitRejected(rejectedNow);
        state.screen = "achievements";
        render();
      };
    }
  }

  function commitRejected(rejectedNow) {
    var keys = Object.keys(rejectedNow);
    if (keys.length === 0) return;
    var existing = loadRejected();
    var existingKeys = {};
    existing.forEach(function (w) { existingKeys[w.en.toLowerCase()] = true; });
    keys.forEach(function (k) {
      if (!existingKeys[k]) {
        existing.push(rejectedNow[k]);
        existingKeys[k] = true;
      }
    });
    saveRejected(existing);
  }

  // ---------- SETTINGS ----------
  function renderSettings() {
    var tab = state.settingsTab;
    var custom = loadCustomWords();
    var rejected = loadRejected();

    var body = "";
    if (tab === "add") {
      body =
        '<div class="row">' +
          '<input type="text" id="enInput" placeholder="Слово на английском">' +
          '<input type="text" id="ruInput" placeholder="Перевод на русском">' +
        '</div>' +
        '<button class="btn small" id="addWordBtn" style="width:auto;">Добавить</button>' +
        '<h3>Твои слова (' + custom.length + ')</h3>' +
        '<div class="word-list">' +
          custom.map(function (w, i) {
            return '<div class="word-row"><span>' + escapeHtml(w.en) + ' - ' + escapeHtml(w.ru) + '</span><button data-idx="' + i + '">Удалить</button></div>';
          }).join("") +
        '</div>';
    } else if (tab === "bulk") {
      body =
        '<p style="font-size:13px;color:#777;">По одной паре на строку, формат: слово - перевод</p>' +
        '<textarea id="bulkInput" placeholder="dog - собака\ncat - кошка"></textarea>' +
        '<button class="btn small" id="bulkAddBtn" style="width:auto;margin-top:8px;">Импортировать</button>';
    } else if (tab === "rejected") {
      body =
        '<h3>Убранные слова (' + rejected.length + ')</h3>' +
        '<p style="font-size:13px;color:#777;">Эти слова не появляются в игре. Верни, если передумал.</p>' +
        '<div class="word-list">' +
          rejected.map(function (w, i) {
            return '<div class="word-row"><span>' + escapeHtml(w.en) + ' - ' + escapeHtml(w.ru) + '</span><button data-idx="' + i + '">Вернуть</button></div>';
          }).join("") +
        '</div>';
    }

    var pool = getActiveWordPool();

    app.innerHTML =
      '<div class="screen" style="justify-content:flex-start;">' +
        '<h2>Настройки слов</h2>' +
        '<div class="stat-line">Активно слов в игре: ' + pool.length + ' (Начинающий: ' + A1_WORDS.length + ', Элементарный: ' + A2_WORDS.length + ', Средний: ' + B1_WORDS.length + ', Выше среднего: ' + B2_WORDS.length + ', Продвинутый: ' + C1_WORDS.length + ', свои: ' + custom.length + ', убрано: ' + rejected.length + ')</div>' +
        '<div class="tabs">' +
          '<button data-tab="add" class="' + (tab === "add" ? "active" : "") + '">Добавить</button>' +
          '<button data-tab="bulk" class="' + (tab === "bulk" ? "active" : "") + '">Массово</button>' +
          '<button data-tab="rejected" class="' + (tab === "rejected" ? "active" : "") + '">Убранные</button>' +
        '</div>' +
        '<div class="settings-panel">' + body + '</div>' +
        '<button class="btn secondary" id="backBtn">Назад</button>' +
        '<button id="resetProgressBtn" style="margin-top:14px;background:none;border:none;color:rgba(140,150,184,.35);font-size:10px;cursor:pointer;padding:4px;">сброс</button>' +
      '</div>';

    Array.prototype.forEach.call(document.querySelectorAll(".tabs button"), function (btn) {
      btn.onclick = function () {
        state.settingsTab = btn.getAttribute("data-tab");
        render();
      };
    });

    document.getElementById("resetProgressBtn").onclick = function () {
      if (!confirm("Точно сбросить рекорд, пазл и лучший результат за раунд? Это нельзя отменить.")) return;
      [LS_RECORD, LS_LIFETIME_SCORE, LS_PUZZLE_PERMS].forEach(function (k) { localStorage.removeItem(k); });
      state.screen = "home";
      render();
    };

    document.getElementById("backBtn").onclick = function () {
      state.screen = "home";
      render();
    };

    if (tab === "add") {
      document.getElementById("addWordBtn").onclick = function () {
        var en = document.getElementById("enInput").value.trim();
        var ru = document.getElementById("ruInput").value.trim();
        if (!en || !ru) return;
        var list = loadCustomWords();
        list.push({ en: en, ru: ru });
        saveCustomWords(list);
        render();
      };
      Array.prototype.forEach.call(document.querySelectorAll("#app .word-list button"), function (btn) {
        btn.onclick = function () {
          var idx = parseInt(btn.getAttribute("data-idx"), 10);
          var list = loadCustomWords();
          list.splice(idx, 1);
          saveCustomWords(list);
          render();
        };
      });
    } else if (tab === "bulk") {
      document.getElementById("bulkAddBtn").onclick = function () {
        var text = document.getElementById("bulkInput").value;
        var lines = text.split("\n");
        var list = loadCustomWords();
        var added = 0;
        lines.forEach(function (line) {
          line = line.trim();
          if (!line) return;
          var parts = line.split(/\s+-\s+/);
          if (parts.length !== 2) {
            parts = line.split("-");
          }
          if (parts.length === 2) {
            var en = parts[0].trim();
            var ru = parts[1].trim();
            if (en && ru) {
              list.push({ en: en, ru: ru });
              added++;
            }
          }
        });
        saveCustomWords(list);
        render();
      };
    } else if (tab === "rejected") {
      Array.prototype.forEach.call(document.querySelectorAll("#app .word-list button"), function (btn) {
        btn.onclick = function () {
          var idx = parseInt(btn.getAttribute("data-idx"), 10);
          var list = loadRejected();
          list.splice(idx, 1);
          saveRejected(list);
          render();
        };
      });
    }
  }

  render();
})();
</script>
</body>
</html>
