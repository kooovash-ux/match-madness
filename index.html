<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Match Madness</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    background: #ffffff;
    color: #4b4b4b;
    min-height: 100vh;
  }
  .app {
    max-width: 480px;
    margin: 0 auto;
    padding: 16px;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  .topbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
  }
  .timer {
    font-size: 28px;
    font-weight: 800;
    color: #58CC02;
    transition: color 0.2s;
  }
  .timer.low { color: #FF4B4B; }
  .score {
    font-size: 20px;
    font-weight: 700;
    color: #4b4b4b;
  }
  .round-label {
    text-align: center;
    font-size: 14px;
    font-weight: 700;
    color: #afafaf;
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 12px;
  }
  .board {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    flex: 1;
  }
  .col { display: flex; flex-direction: column; gap: 10px; }
  .card {
    border: none;
    border-radius: 14px;
    padding: 16px 10px;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    color: #fff;
    box-shadow: 0 4px 0 rgba(0,0,0,0.15);
    transition: transform 0.08s, opacity 0.25s, box-shadow 0.08s;
    text-align: center;
    user-select: none;
    min-height: 56px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .card.en { background: #1CB0F6; }
  .card.ru { background: #FF9600; }
  .card:active { transform: translateY(3px); box-shadow: 0 1px 0 rgba(0,0,0,0.15); }
  .card.selected { outline: 3px solid #4b4b4b; }
  .card.correct { animation: flashGreen 0.35s ease; }
  .card.wrong { animation: flashRed 0.35s ease; }
  .card.gone { opacity: 0; pointer-events: none; transform: scale(0.8); }
  .card.matched {
    background: #e5e5e5 !important;
    color: #afafaf;
    cursor: default;
    box-shadow: none;
    transform: none;
  }
  .card.empty { visibility: hidden; pointer-events: none; box-shadow: none; }
  @keyframes flashGreen {
    0% { background: #58CC02; }
    100% { background: #58CC02; }
  }
  @keyframes flashRed {
    0% { background: #FF4B4B; }
    100% { background: #FF4B4B; }
  }

  .screen {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    gap: 16px;
    padding: 24px 8px;
  }
  .screen h1 { font-size: 26px; margin: 0; color: #4b4b4b; }
  .screen h2 { font-size: 20px; margin: 0; color: #4b4b4b; }
  .screen p { margin: 0; color: #777; font-size: 15px; }
  .big-score { font-size: 48px; font-weight: 800; color: #58CC02; }

  .btn {
    background: #58CC02;
    color: #fff;
    border: none;
    border-radius: 14px;
    padding: 14px 32px;
    font-size: 16px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    cursor: pointer;
    box-shadow: 0 4px 0 #4aa302;
    width: 100%;
    max-width: 280px;
  }
  .btn:active { transform: translateY(3px); box-shadow: none; }
  .btn.secondary {
    background: #fff;
    color: #4b4b4b;
    border: 2px solid #e5e5e5;
    box-shadow: 0 4px 0 #d0d0d0;
  }
  .btn.small { padding: 10px 20px; font-size: 13px; }

  .reject-list {
    width: 100%;
    max-height: 260px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin: 8px 0;
  }
  .reject-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: #f7f7f7;
    border-radius: 10px;
    padding: 10px 14px;
    font-size: 15px;
  }
  .reject-item span { text-align: left; }
  .reject-item button {
    background: none;
    border: 2px solid #e5e5e5;
    border-radius: 8px;
    padding: 4px 10px;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    color: #999;
  }
  .reject-item button.marked {
    background: #FF4B4B;
    border-color: #FF4B4B;
    color: #fff;
  }

  .settings-panel { width: 100%; text-align: left; }
  .settings-panel h3 { font-size: 15px; margin: 14px 0 6px; color: #4b4b4b; }
  .settings-panel .row { display: flex; gap: 8px; margin-bottom: 8px; }
  .settings-panel input, .settings-panel textarea {
    flex: 1;
    border: 2px solid #e5e5e5;
    border-radius: 10px;
    padding: 10px 12px;
    font-size: 14px;
    font-family: inherit;
  }
  .settings-panel textarea { width: 100%; min-height: 80px; resize: vertical; }
  .word-list { max-height: 150px; overflow-y: auto; margin-bottom: 8px; }
  .word-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 6px 0;
    border-bottom: 1px solid #f0f0f0;
    font-size: 13px;
  }
  .word-row button {
    background: none;
    border: none;
    color: #FF4B4B;
    font-weight: 700;
    cursor: pointer;
    font-size: 13px;
  }
  .tabs { display: flex; gap: 6px; margin-bottom: 10px; }
  .tabs button {
    flex: 1;
    padding: 8px;
    border: 2px solid #e5e5e5;
    background: #fff;
    border-radius: 10px;
    font-weight: 700;
    font-size: 12px;
    cursor: pointer;
    color: #999;
  }
  .tabs button.active {
    border-color: #58CC02;
    color: #58CC02;
    background: #f0fce6;
  }
  .stat-line { font-size: 13px; color: #999; margin-bottom: 6px; }

  .record-card {
    width: 100%;
    max-width: 280px;
    background: linear-gradient(135deg, #f0fce6, #fff);
    border: 2px solid #58CC02;
    border-radius: 16px;
    padding: 14px 16px;
    margin-bottom: 4px;
    text-align: center;
  }
  .record-card .stars {
    font-size: 22px;
    color: #FFC800;
    letter-spacing: 4px;
    line-height: 1;
    margin-bottom: 4px;
  }
  .record-card .record-main {
    font-size: 26px;
    font-weight: 800;
    color: #4b4b4b;
  }
  .record-card .record-sub {
    font-size: 13px;
    color: #888;
    margin-top: 2px;
  }
  .record-card.empty {
    background: #fafafa;
    border: 2px dashed #e5e5e5;
  }
  .record-card.empty .record-main { color: #afafaf; font-size: 15px; font-weight: 700; }
  .hidden { display: none !important; }
</style>

  function formatDateTime(d) {
    var pad = function (n) { return n < 10 ? "0" + n : "" + n; };
    return pad(d.getDate()) + "." + pad(d.getMonth() + 1) + "." + d.getFullYear() +
      " " + pad(d.getHours()) + ":" + pad(d.getMinutes());
  }

  var state = {
    screen: "home", // home, playing, gameOver, settings
    timeLeft: START_TIME,
    score: 0,
    matchedCount: 0,
    timerHandle: null,
    poolQueue: [],
    idCounter: 0,
    usedWords: [], // words used this whole game session {en, ru}
    board: [], // current cycle entries: {id, en, ru, matched}
    rightOrder: [], // ids in shuffled order, fixed for the current cycle
    selectedLeft: null,
    selectedRight: null,
    busy: false,
    settingsTab: "add"
  };

  var app = document.getElementById("app");

  function render() {
    if (state.screen === "home") return renderHome();
    if (state.screen === "playing") return renderPlaying();
    if (state.screen === "gameOver") return renderGameOver();
    if (state.screen === "settings") return renderSettings();
  }

  // ---------- HOME ----------
  function renderHome() {
    var record = loadRecord();
    var recordHtml;
    if (record) {
      var stars = starsFor(record.matched);
      recordHtml =
        '<div class="record-card">' +
          '<div class="stars">' + starsHtml(stars) + '</div>' +
          '<div class="record-main">' + pluralWords(record.matched) + '</div>' +
          '<div class="record-sub">' + (record.score || 0) + ' очков · ' + record.date + '</div>' +
        '</div>';
    } else {
      recordHtml = '<div class="record-card empty"><div class="record-main">Рекордов пока нет - сыграй первую игру</div></div>';
    }

    var mode = loadSourceMode();
    var customCount = loadCustomWords().length;

    var modeTabsHtml =
      '<div class="tabs" style="max-width:280px;width:100%;">' +
        '<button data-mode="all" class="' + (mode === "all" ? "active" : "") + '">Все</button>' +
        '<button data-mode="system" class="' + (mode === "system" ? "active" : "") + '">База (' + SYSTEM_WORDS.length + ')</button>' +
        '<button data-mode="custom" class="' + (mode === "custom" ? "active" : "") + '">Мои (' + customCount + ')</button>' +
      '</div>';

    var pool = getActiveWordPool();

    app.innerHTML =
      '<div class="screen">' +
        '<h1>Match Madness</h1>' +
        '<p>Собери пары слов на скорость. Правильный ответ - время и очки. Ошибка - минус время.</p>' +
        recordHtml +
        modeTabsHtml +
        '<div class="stat-line" id="poolCountLine">Слов в игре: ' + pool.length + '</div>' +
        '<button class="btn" id="startBtn">Начать</button>' +
        '<button class="btn secondary" id="settingsBtn">Настройки слов</button>' +
      '</div>';

    Array.prototype.forEach.call(document.querySelectorAll(".tabs button"), function (btn) {
      btn.onclick = function () {
        saveSourceMode(btn.getAttribute("data-mode"));
        render();
      };
    });

    document.getElementById("startBtn").onclick = startGame;
    document.getElementById("settingsBtn").onclick = function () {
      state.screen = "settings";
      render();
    };
  }

  function startGame() {
    var pool = getActiveWordPool();
    if (pool.length < CYCLE_SIZE) {
      alert("Нужно минимум " + CYCLE_SIZE + " слов в базе, чтобы начать игру. Сейчас: " + pool.length);
      return;
    }
    state.poolQueue = shuffle(pool);
    state.idCounter = 0;
    state.timeLeft = START_TIME;
    state.score = 0;
    state.matchedCount = 0;
    state.usedWords = [];
    state.selectedLeft = null;
    state.selectedRight = null;
    state.busy = false;
    state.screen = "playing";

    startCycle();
    render();
    startTimer();
  }

  // ---------- PLAYING ----------
  function nextWordsFromPool(count) {
    var activePool = getActiveWordPool();
    var words = [];
    for (var i = 0; i < count; i++) {
      if (state.poolQueue.length === 0) {
        state.poolQueue = shuffle(activePool);
      }
      words.push(state.poolQueue.shift());
    }
    return words;
  }

  function startCycle() {
    var words = nextWordsFromPool(CYCLE_SIZE);
    words.forEach(function (w) {
      var already = state.usedWords.some(function (u) { return u.en === w.en; });
      if (!already) state.usedWords.push(w);
    });
    state.board = words.map(function (w) {
      return { id: state.idCounter++, en: w.en, ru: w.ru, matched: false };
    });
    state.rightOrder = shuffle(state.board.map(function (c) { return c.id; }));
    state.selectedLeft = null;
    state.selectedRight = null;
    state.busy = false;
  }

  function startTimer() {
    if (state.timerHandle) clearInterval(state.timerHandle);
    state.timerHandle = setInterval(function () {
      state.timeLeft -= 1;
      updateTimerDisplay();
      if (state.timeLeft <= 0) {
        clearInterval(state.timerHandle);
        state.timeLeft = 0;
        timeUp();
      }
    }, 1000);
  }

  function stopTimer() {
    if (state.timerHandle) {
      clearInterval(state.timerHandle);
      state.timerHandle = null;
    }
  }

  function updateTimerDisplay() {
    var el = document.getElementById("timerDisplay");
    if (!el) return;
    var m = Math.floor(state.timeLeft / 60);
    var s = state.timeLeft % 60;
    el.textContent = (m < 10 ? "0" : "") + m + ":" + (s < 10 ? "0" : "") + s;
    el.classList.toggle("low", state.timeLeft <= 10);
  }

  function timeUp() {
    state.gameOverReason = "time";
    endGame();
  }

  function renderPlaying() {
    var byId = {};
    state.board.forEach(function (c) { byId[c.id] = c; });
    var rightItems = state.rightOrder.map(function (id) { return byId[id]; });

    var leftHtml = state.board.map(function (c) {
      return '<button class="card en' + (c.matched ? ' matched' : '') + '" data-side="left" data-id="' + c.id + '"' + (c.matched ? ' disabled' : '') + '>' + escapeHtml(c.en) + '</button>';
    }).join("");
    var rightHtml = rightItems.map(function (c) {
      return '<button class="card ru' + (c.matched ? ' matched' : '') + '" data-side="right" data-id="' + c.id + '"' + (c.matched ? ' disabled' : '') + '>' + escapeHtml(c.ru) + '</button>';
    }).join("");

    app.innerHTML =
      '<div class="topbar">' +
        '<div class="timer" id="timerDisplay"></div>' +
        '<div class="score" id="scoreDisplay">' + state.score + ' очк.</div>' +
      '</div>' +
      '<div class="round-label">Смэтчено: ' + state.matchedCount + '</div>' +
      '<div class="board">' +
        '<div class="col" id="colLeft">' + leftHtml + '</div>' +
        '<div class="col" id="colRight">' + rightHtml + '</div>' +
      '</div>';

    updateTimerDisplay();

    Array.prototype.forEach.call(document.querySelectorAll(".card"), function (btn) {
      btn.onclick = onCardClick;
    });
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function onCardClick(e) {
    var btn = e.currentTarget;
    var side = btn.getAttribute("data-side");
    var id = parseInt(btn.getAttribute("data-id"), 10);

    if (state.busy) return;
    if (btn.classList.contains("matched")) return;

    Array.prototype.forEach.call(document.querySelectorAll(".card[data-side='" + side + "']"), function (b) {
      b.classList.remove("selected");
    });
    btn.classList.add("selected");

    if (side === "left") state.selectedLeft = id;
    else state.selectedRight = id;

    if (state.selectedLeft !== null && state.selectedRight !== null) {
      checkMatch();
    }
  }

  function checkMatch() {
    state.busy = true;
    var leftId = state.selectedLeft;
    var rightId = state.selectedRight;
    var leftBtn = document.querySelector(".card[data-side='left'][data-id='" + leftId + "']");
    var rightBtn = document.querySelector(".card[data-side='right'][data-id='" + rightId + "']");

    var isMatch = leftId === rightId;

    if (isMatch) {
      state.score += SCORE_CORRECT;
      state.matchedCount += 1;
      state.timeLeft += TIME_BONUS;
      leftBtn.classList.add("correct");
      rightBtn.classList.add("correct");
      updateTimerDisplay();
      updateScoreDisplay();
      setTimeout(function () {
        var item = state.board.filter(function (c) { return c.id === leftId; })[0];
        if (item) item.matched = true;
        state.selectedLeft = null;
        state.selectedRight = null;
        state.busy = false;

        var allMatched = state.board.every(function (c) { return c.matched; });
        if (allMatched) {
          render();
          setTimeout(function () {
            startCycle();
            render();
          }, 400);
        } else {
          render();
        }
      }, 350);
    } else {
      state.score = Math.max(0, state.score - SCORE_WRONG);
      state.timeLeft = Math.max(0, state.timeLeft - TIME_PENALTY);
      leftBtn.classList.add("wrong");
      rightBtn.classList.add("wrong");
      updateTimerDisplay();
      updateScoreDisplay();
      if (state.timeLeft <= 0) {
        setTimeout(function () {
          stopTimer();
          timeUp();
        }, 350);
        return;
      }
      setTimeout(function () {
        leftBtn.classList.remove("selected", "wrong");
        rightBtn.classList.remove("selected", "wrong");
        state.selectedLeft = null;
        state.selectedRight = null;
        state.busy = false;
      }, 350);
    }
  }

  function updateScoreDisplay() {
    var el = document.getElementById("scoreDisplay");
    if (el) el.textContent = state.score + " очк.";
  }

  function endGame() {
    stopTimer();
    state.screen = "gameOver";

    var record = loadRecord();
    state.isNewRecord = !record || state.matchedCount > record.matched;
    if (state.isNewRecord) {
      saveRecord({ matched: state.matchedCount, score: state.score, date: formatDateTime(new Date()) });
    }

    render();
  }

  function renderGameOver() {
    var reason = state.gameOverReason === "time" ? "Время вышло!" : "Игра завершена!";
    var usedWords = state.usedWords;
    var rejectedNow = {};

    var listHtml = usedWords.map(function (w, i) {
      return '<div class="reject-item">' +
        '<span>' + escapeHtml(w.en) + ' - ' + escapeHtml(w.ru) + '</span>' +
        '<button data-idx="' + i + '">Убрать</button>' +
        '</div>';
    }).join("");

    app.innerHTML =
      '<div class="screen">' +
        '<h1>' + reason + '</h1>' +
        '<div class="stars" style="font-size:28px;">' + starsHtml(starsFor(state.matchedCount)) + '</div>' +
        '<div class="big-score">' + state.score + '</div>' +
        '<p>итоговый счёт - замэчено ' + pluralWords(state.matchedCount) + '</p>' +
        (state.isNewRecord ? '<p style="color:#58CC02;font-weight:800;">Новый рекорд!</p>' : '') +
        (usedWords.length ? (
          '<p style="margin-top:8px;">Отметь слова, которые не зашли - они больше не будут появляться:</p>' +
          '<div class="reject-list">' + listHtml + '</div>'
        ) : '') +
        '<button class="btn" id="playAgainBtn">Играть снова</button>' +
        '<button class="btn secondary" id="homeBtn">На главную</button>' +
      '</div>';

    Array.prototype.forEach.call(document.querySelectorAll(".reject-item button"), function (btn) {
      btn.onclick = function () {
        var idx = parseInt(btn.getAttribute("data-idx"), 10);
        var w = usedWords[idx];
        var key = w.en.toLowerCase();
        if (rejectedNow[key]) {
          delete rejectedNow[key];
          btn.classList.remove("marked");
          btn.textContent = "Убрать";
        } else {
          rejectedNow[key] = w;
          btn.classList.add("marked");
          btn.textContent = "Убрано";
        }
      };
    });

    document.getElementById("playAgainBtn").onclick = function () {
      commitRejected(rejectedNow);
      startGame();
    };
    document.getElementById("homeBtn").onclick = function () {
      commitRejected(rejectedNow);
      state.screen = "home";
      render();
    };
  }

  function commitRejected(rejectedNow) {
    var keys = Object.keys(rejectedNow);
    if (keys.length === 0) return;
    var existing = loadRejected();
    var existingKeys = {};
    existing.forEach(function (w) { existingKeys[w.en.toLowerCase()] = true; });
    keys.forEach(function (k) {
      if (!existingKeys[k]) {
        existing.push(rejectedNow[k]);
        existingKeys[k] = true;
      }
    });
    saveRejected(existing);
  }

  // ---------- SETTINGS ----------
  function renderSettings() {
    var tab = state.settingsTab;
    var custom = loadCustomWords();
    var rejected = loadRejected();

    var body = "";
    if (tab === "add") {
      body =
        '<div class="row">' +
          '<input type="text" id="enInput" placeholder="Слово на английском">' +
          '<input type="text" id="ruInput" placeholder="Перевод на русском">' +
        '</div>' +
        '<button class="btn small" id="addWordBtn" style="width:auto;">Добавить</button>' +
        '<h3>Твои слова (' + custom.length + ')</h3>' +
        '<div class="word-list">' +
          custom.map(function (w, i) {
            return '<div class="word-row"><span>' + escapeHtml(w.en) + ' - ' + escapeHtml(w.ru) + '</span><button data-idx="' + i + '">Удалить</button></div>';
          }).join("") +
        '</div>';
    } else if (tab === "bulk") {
      body =
        '<p style="font-size:13px;color:#777;">По одной паре на строку, формат: слово - перевод</p>' +
        '<textarea id="bulkInput" placeholder="dog - собака\ncat - кошка"></textarea>' +
        '<button class="btn small" id="bulkAddBtn" style="width:auto;margin-top:8px;">Импортировать</button>';
    } else if (tab === "rejected") {
      body =
        '<h3>Убранные слова (' + rejected.length + ')</h3>' +
        '<p style="font-size:13px;color:#777;">Эти слова не появляются в игре. Верни, если передумал.</p>' +
        '<div class="word-list">' +
          rejected.map(function (w, i) {
            return '<div class="word-row"><span>' + escapeHtml(w.en) + ' - ' + escapeHtml(w.ru) + '</span><button data-idx="' + i + '">Вернуть</button></div>';
          }).join("") +
        '</div>';
    }

    var pool = getActiveWordPool();

    app.innerHTML =
      '<div class="screen" style="justify-content:flex-start;">' +
        '<h2>Настройки слов</h2>' +
        '<div class="stat-line">Активно слов в игре: ' + pool.length + ' (база: ' + SYSTEM_WORDS.length + ', свои: ' + custom.length + ', убрано: ' + rejected.length + ')</div>' +
        '<div class="tabs">' +
          '<button data-tab="add" class="' + (tab === "add" ? "active" : "") + '">Добавить</button>' +
          '<button data-tab="bulk" class="' + (tab === "bulk" ? "active" : "") + '">Массово</button>' +
          '<button data-tab="rejected" class="' + (tab === "rejected" ? "active" : "") + '">Убранные</button>' +
        '</div>' +
        '<div class="settings-panel">' + body + '</div>' +
        '<button class="btn secondary" id="backBtn">Назад</button>' +
      '</div>';

    Array.prototype.forEach.call(document.querySelectorAll(".tabs button"), function (btn) {
      btn.onclick = function () {
        state.settingsTab = btn.getAttribute("data-tab");
        render();
      };
    });

    document.getElementById("backBtn").onclick = function () {
      state.screen = "home";
      render();
    };

    if (tab === "add") {
      document.getElementById("addWordBtn").onclick = function () {
        var en = document.getElementById("enInput").value.trim();
        var ru = document.getElementById("ruInput").value.trim();
        if (!en || !ru) return;
        var list = loadCustomWords();
        list.push({ en: en, ru: ru });
        saveCustomWords(list);
        render();
      };
      Array.prototype.forEach.call(document.querySelectorAll("#app .word-list button"), function (btn) {
        btn.onclick = function () {
          var idx = parseInt(btn.getAttribute("data-idx"), 10);
          var list = loadCustomWords();
          list.splice(idx, 1);
          saveCustomWords(list);
          render();
        };
      });
    } else if (tab === "bulk") {
      document.getElementById("bulkAddBtn").onclick = function () {
        var text = document.getElementById("bulkInput").value;
        var lines = text.split("\n");
        var list = loadCustomWords();
        var added = 0;
        lines.forEach(function (line) {
          line = line.trim();
          if (!line) return;
          var parts = line.split(/\s+-\s+/);
          if (parts.length !== 2) {
            parts = line.split("-");
          }
          if (parts.length === 2) {
            var en = parts[0].trim();
            var ru = parts[1].trim();
            if (en && ru) {
              list.push({ en: en, ru: ru });
              added++;
            }
          }
        });
        saveCustomWords(list);
        render();
      };
    } else if (tab === "rejected") {
      Array.prototype.forEach.call(document.querySelectorAll("#app .word-list button"), function (btn) {
        btn.onclick = function () {
          var idx = parseInt(btn.getAttribute("data-idx"), 10);
          var list = loadRejected();
          list.splice(idx, 1);
          saveRejected(list);
          render();
        };
      });
    }
  }

  render();
})();
</script>
</body>
</html>
